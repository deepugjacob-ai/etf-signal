name: Signal engine

on:
  schedule:
    - cron: "*/20 23 * * 0-4"
    - cron: "*/20 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - check now
          - test alert
        default: check now

permissions:
  contents: write

concurrency:
  group: signal-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VAPID_SUB: https://${{ github.repository_owner }}.github.io
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MODE" = "test alert" ]; then
            python -m engine.main --test-push
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python -m engine.main --force
          else
            python -m engine.main
          fi

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          M=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$M" ]; then
            echo "$M" > .keepalive
            git config user.name "signal-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keep schedule alive ($M)"
            git push
          fi
