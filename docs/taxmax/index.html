<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F3D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaxMax">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>TaxMax Command</title>
<style>
:root{
  --bg:#0B2223; --panel:#10393A; --panel2:#0E3132; --line:#1E5152; --line2:#2A6668;
  --ink:#E8F0EE; --ink-dim:#9DBBB6; --ink-faint:#6E908C;
  --teal:#14B8A6; --teal-deep:#0F3D3E; --gold:#D9B24A; --amber:#E3A008; --red:#E2574C; --green:#3FBF7F;
  --mono:"SF Mono",Consolas,Menlo,monospace;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
::selection{background:var(--teal);color:#04211E}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:normal;letter-spacing:.2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{background:#0A2A2B;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 9px;font-size:14px;font-family:var(--sans)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
input[type=number]{font-family:var(--mono);text-align:right}
label{color:var(--ink-dim);font-size:12.5px;display:block;margin-bottom:3px}
a{color:var(--teal)}
.app{display:flex;min-height:100vh}
/* left nav */
.nav{width:212px;flex:0 0 212px;background:var(--teal-deep);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand h1{font-size:19px;color:var(--ink)}
.brand h1 b{color:var(--teal);font-weight:normal}
.brand .fy{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:1.5px;margin-top:2px}
.nav button.tab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--ink-dim);padding:9px 18px;font-size:13.5px;border-left:3px solid transparent}
.nav button.tab:hover{color:var(--ink);background:rgba(20,184,166,.06)}
.nav button.tab.on{color:var(--ink);border-left-color:var(--teal);background:rgba(20,184,166,.10)}
.nav .glyph{font-family:var(--mono);font-size:11px;color:var(--teal);width:22px;display:inline-block}
.nav .foot{padding:14px 18px;font-size:11px;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:12px}
/* main */
.main{flex:1;min-width:0;padding:22px 26px 80px}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pagehead h2{font-size:23px}
.pagehead .sub{color:var(--ink-dim);font-size:13px;max-width:640px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}.nav{width:64px;flex-basis:64px}.nav .tlabel,.brand,.nav .foot{display:none}}
/* Phone layout: sidebar becomes a scrolling top bar, everything full width, tables scroll */
/* Mobile bar + menu: hidden by default (desktop), shown inside the phone media query below */
.mobilebar{display:none}
.mobile-menu{display:none;position:sticky;top:52px;z-index:55;background:var(--teal-deep);border-bottom:1px solid var(--line);max-height:70vh;overflow-y:auto}
.mobile-menu button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);padding:14px 18px;font-size:15px}
.mobile-menu button.on{color:var(--teal);background:rgba(20,184,166,.10)}
@media(max-width:640px){
  table.fvlist{display:block;white-space:normal;overflow:visible}
  table.fvlist tbody,table.fvlist tr,table.fvlist td{display:block;width:auto}
  table.fvlist tr:first-child{display:none}
  table.fvlist tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
  table.fvlist td{border:0;padding:2px 0;text-align:left}
  table.fvlist td.num:first-child{font-size:11.5px;color:var(--ink-dim)}
  table.fvlist td:last-child{white-space:normal;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  table.mtlist td:last-child{display:block;margin-top:2px}
  table.mtlist td.money{font-size:15px;font-weight:600}
}
@media(max-width:640px){
  .app{flex-direction:column;min-height:auto}
  .nav{display:none!important}  /* desktop sidebar hidden on phones; use hamburger menu instead */
  .main{padding:14px 12px 60px}
  .pagehead{flex-direction:column;gap:6px}
  .pagehead h2{font-size:20px}
  .two{grid-template-columns:1fr}
  .card{padding:12px}
  table{display:block;overflow-x:auto;white-space:nowrap;font-size:12.5px;-webkit-overflow-scrolling:touch}
  .row{flex-wrap:wrap}
  input,select,textarea,button{font-size:16px}
  .btn,.btn.sm{min-height:40px}
  .ledger{grid-template-columns:1fr}
  .mobilebar{display:flex!important;align-items:center;gap:8px;padding:10px 12px;background:var(--teal-deep);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
  .mobilebar h1{font-size:16px;color:var(--ink)} .mobilebar h1 b{color:var(--teal);font-weight:normal}
  .mobile-menu.open{display:block!important}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:16px;margin-bottom:10px;color:var(--ink)}
.card h3 .tag{font-family:var(--mono);font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.hint{color:var(--ink-faint);font-size:12px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:130px}
.btn{background:var(--teal);color:#04211E;border:none;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.dim{background:transparent;color:var(--ink-dim);border:1px solid var(--line2)}
.btn.warn{background:var(--amber);color:#231A02}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line2);color:var(--ink-dim)}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.bad{color:var(--red);border-color:var(--red)}
.pill.mid{color:var(--amber);border-color:var(--amber)}
.pill.gold{color:var(--gold);border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--ink-faint);font-weight:500;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(30,81,82,.5);vertical-align:top}
td.num,th.num{text-align:right}
tr:hover td{background:rgba(20,184,166,.04)}
.money{font-family:var(--mono)}
.money.pos{color:var(--green)}.money.neg{color:var(--red)}
/* ledger gauges */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.ledger{grid-template-columns:1fr}}
.gauge{background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line2);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.gauge:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 120px at 20% 0%,rgba(20,184,166,.14),transparent)}
.gauge .who{font-family:var(--serif);font-size:17px;color:var(--ink)}
.gauge .figure{font-family:var(--mono);font-size:38px;letter-spacing:-1px;margin:6px 0 2px}
.gauge .figure.pos{color:var(--green)}.gauge .figure.neg{color:var(--red)}
.gauge .cap{font-size:12px;color:var(--ink-dim)}
.gauge .mini{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px;font-size:12.5px}
.gauge .mini span{color:var(--ink-faint)}
.gauge .mini b{font-family:var(--mono);font-weight:normal;color:var(--ink)}
/* alerts */
.alert{border-left:3px solid var(--amber);background:rgba(227,160,8,.07);padding:10px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.alert.red{border-color:var(--red);background:rgba(226,87,76,.08)}
.alert.teal{border-color:var(--teal);background:rgba(20,184,166,.07)}
.alert b{color:var(--ink)}
.alert .sev{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--amber)}
.alert.red .sev{color:var(--red)}.alert.teal .sev{color:var(--teal)}
/* interview */
.qcard{border:1px solid var(--line2);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--panel2)}
.qcard .qtxt{font-size:14.5px;margin-bottom:8px}
.qcard .save{font-family:var(--mono);font-size:11px;color:var(--gold)}
.qdone{opacity:.55}
.qoverlap{border-color:var(--gold)}
/* lodge sheet: the handoff schedule */
.sheet{background:#F4F1E8;color:#22302E;border-radius:10px;padding:22px 26px;font-family:var(--serif)}
.sheet h3{color:#0F3D3E;border-bottom:2px solid #0F3D3E;padding-bottom:6px;margin-bottom:10px;font-size:18px}
.sheet h4{color:#0F3D3E;font-size:14px;margin:16px 0 6px;font-family:var(--sans);text-transform:uppercase;letter-spacing:1px}
.sheet table{font-size:13.5px}
.sheet td,.sheet th{border-bottom:1px solid #D8D2C0;color:#22302E}
.sheet th{color:#6B7A6F}
.sheet .money{color:#0F3D3E;font-weight:bold}
.sheet .loc{font-family:var(--mono);font-size:11px;background:#0F3D3E;color:#F4F1E8;border-radius:3px;padding:1px 5px;white-space:nowrap}
.sheet .note{font-size:12px;color:#6B7A6F;font-family:var(--sans)}
.sheet tr:hover td{background:rgba(15,61,62,.05)}
.copybtn{font-size:10px;border:1px solid #0F3D3E;background:none;color:#0F3D3E;border-radius:3px;padding:1px 5px;font-family:var(--mono)}
/* misc */
.drop{border:2px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--ink-dim)}
.drop.over{border-color:var(--teal);color:var(--teal)}
.doc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.doc .dicon{font-family:var(--mono);color:var(--gold);font-size:11px;border:1px solid var(--gold);border-radius:4px;padding:2px 5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;right:18px;background:var(--teal-deep);border:1px solid var(--teal);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:20px;max-width:760px;width:92%;max-height:90vh;overflow-y:auto}
dialog::backdrop{background:rgba(4,20,20,.7)}
textarea.big{width:100%;min-height:180px;font-family:var(--mono);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv span{color:var(--ink-faint)}
.progressbar{height:7px;background:#0A2A2B;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:4px;transition:width .5s}
details{margin:6px 0}
summary{cursor:pointer;color:var(--teal);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="mobilebar">
    <button id="hamBtn" aria-label="Menu" style="background:none;border:none;color:var(--ink);font-size:26px;line-height:1;padding:4px 8px;cursor:pointer">&#9776;</button>
    <h1 style="flex:1;text-align:center">TaxMax <b>Command</b></h1>
    <select id="fySelectM" title="Financial year" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px"></select>
  </div>
  <div id="mobileMenu" class="mobile-menu"></div>
  <nav class="nav">
    <div class="brand">
      <h1>TaxMax <b>Command</b></h1>
      <div class="fy"><select id="fySelect" title="Financial year"></select> &middot; AU</div>
    </div>
    <div id="tabs"></div>
    <div class="foot" id="foot">General information tool, not a registered tax agent. Verify against ato.gov.au before lodging.</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div id="toasts"></div>
<dialog id="modal"></dialog>
<script>
"use strict";
/* =====================================================
   TAXMAX COMMAND : FY2025-26 constants (verified 2 July 2026)
===================================================== */
const FY_REGISTRY = {
  "2025-26": {
    label: "2025-26", start: "2025-07-01", end: "2026-06-30", ratesProvisional:false,
    brackets: [ [18200,0],[45000,0.16],[135000,0.30],[190000,0.37],[Infinity,0.45] ],
    medicareRate: 0.02,
    lito: { max:700, full:37500, taper1:0.05, mid:45000, taper2:0.015, end:66667 },
    // ATO 2025-26: singles 101,000 / 118,000 / 158,000; families 202,000 / 236,000 / 316,000.
    // Family threshold +$1,500 for each MLS dependent child AFTER the first.
    mls: { familyBase:202000, perExtraChild:1500, single:101000,
           tiers:[ [236000,0.01],[316000,0.0125],[Infinity,0.015] ],
           singleTiers:[ [118000,0.01],[158000,0.0125],[Infinity,0.015] ] },
    centsPerKm: 0.88, cpkCap: 5000,
    wfhFixedRate: 0.70,
    instantWriteOffSmallBiz: 20000,
    immediateAssetEmployee: 300,
    gstRate: 0.10,
    cgtDiscount: 0.5,
    medicareLowerSingle: 28011,
    medicareUpperSingle: 35013,
    medicareFamilyLower: 47238,
    medicareFamilyUpper: 59047,
    medicarePerChild: 4338,
    medicareShadeIn: 0.10,
    help: { thresholds:[ [67000,0.15,0],[125000,0.17,8700],[179286,0.10,null] ] },
    div293: { threshold:250000, rate:0.15 },
    sgRate: 0.12,
    concessionalCap: 30000,
    sbito: { rate:0.16, cap:1000 }
  }
};
// A provisional next-year template: dates are correct, RATES are last year's placeholders
// until the government sets FY27 figures. Marked provisional so the tool warns and won't
// present its calculations as final.
// structuredClone keeps Infinity (JSON round-tripping turned the top bracket into null,
// which produced a NEGATIVE tax slice above $190k in every provisional year).
function cloneFY(o){ return (typeof structuredClone==="function") ? structuredClone(o)
  : JSON.parse(JSON.stringify(o), (k,v)=>v===null?Infinity:v); }
function provisionalFY(yearStartCal, overrides){
  const base=cloneFY(FY_REGISTRY["2025-26"]);
  const s=yearStartCal, e=yearStartCal+1;
  base.label = s+"-"+String(e).slice(2);
  base.start = s+"-07-01";
  base.end = e+"-06-30";
  base.ratesProvisional = true;
  return Object.assign(base, overrides||{});
}
// FY2026-27: figures already set in law / by the ATO (checked 25 Oct 2026):
//   15% bottom rate (Treasury Laws Amendment (Cost of Living Tax Cuts) 2025), MLS thresholds,
//   91c/km (LI 2026/19), $32,500 concessional cap, $20k instant asset write-off now permanent.
// Still provisional: Medicare low-income thresholds, HELP thresholds, WFH rate (70c until the ATO says otherwise).
FY_REGISTRY["2026-27"] = provisionalFY(2026, {
  brackets: [ [18200,0],[45000,0.15],[135000,0.30],[190000,0.37],[Infinity,0.45] ],
  mls: { familyBase:210000, perExtraChild:1500, single:105000,
         tiers:[ [246000,0.01],[328000,0.0125],[Infinity,0.015] ],
         singleTiers:[ [123000,0.01],[164000,0.0125],[Infinity,0.015] ] },
  centsPerKm: 0.91,
  concessionalCap: 32500,
  partlyVerified: "Brackets (15%), MLS tiers, 91c/km, $32,500 cap and $20k write-off are confirmed. Medicare low-income and HELP thresholds, and the WFH rate, are still last year's figures."
});
FY_REGISTRY["2027-28"] = provisionalFY(2027, {
  brackets: [ [18200,0],[45000,0.14],[135000,0.30],[190000,0.37],[Infinity,0.45] ],
  mls: cloneFY(FY_REGISTRY["2026-27"].mls),
  centsPerKm: 0.91,
  concessionalCap: 32500
});

// FY is a live object the whole engine reads. setActiveFY swaps its contents.
let FY = Object.assign({}, FY_REGISTRY["2025-26"]);
function fyEndText(){ const y=FY.end.slice(0,4); return "30 June "+y; }
function lodgeDueText(){ return "31 October "+FY.end.slice(0,4); }
function fyDays(){ return Math.round((new Date(FY.end)-new Date(FY.start))/86400000)+1; }
function qtext(q,name){ return q.q.replace("{name}",name).replace("{fy}",FY.label).replace("{fyEnd}",fyEndText()).replace("{cpk}",Math.round(FY.centsPerKm*100)+"c"); }
function setActiveFYRates(label){
  const r = FY_REGISTRY[label] || FY_REGISTRY["2025-26"];
  Object.keys(FY).forEach(k=>delete FY[k]);
  Object.assign(FY, r);
}
const CATS = {
  D1:{label:"D1 Work-related car", who:"employee"},
  D2:{label:"D2 Work-related travel", who:"employee"},
  D3:{label:"D3 Clothing / laundry", who:"employee"},
  D4:{label:"D4 Self-education", who:"employee"},
  D5:{label:"D5 Other work-related", who:"employee"},
  D9:{label:"D9 Gifts & donations", who:"any"},
  D10:{label:"D10 Cost of managing tax affairs", who:"any"},
  D12:{label:"D12 Personal super contributions", who:"any"},
  D15:{label:"D15 Other (income protection etc)", who:"any"},
  BIZ_UBER:{label:"Business expense (Uber)", who:"biz"},
  BIZ_MER:{label:"Business expense (Meridian)", who:"biz"},
  RENT:{label:"Rental property expense", who:"rent"},
  CGT:{label:"CGT cost base / selling cost", who:"cgt"}
};
/* ================= STATE ================= */
const LS_KEY = "taxmax_command_v1";
const blank = () => ({
  version:1,
  meta:{ lastBackup:null, setupDone:false, activeFY:"2025-26" },
  cfg:{
    // Display config. Internal person slots stay "deepu"/"bhavana" for engine stability;
    // these names are what the user sees everywhere.
    nameA:"", nameB:"", hasSpouse:true,
    modules:{ business:true, rental:true },   // toggle whole sections on/off
    // business slot labels (two generic slots, kept keys uber/meridian internally)
    bizA:{ on:true, name:"", type:"rideshare" },   // type: rideshare | services | other
    bizB:{ on:true, name:"", type:"services" }
  },
  ai:{ mode:"gemini", provider:"gemini", geminiKey:"", geminiModel:"gemini-2.5-flash-lite", autoRead:true },   // autoRead: extract on upload
  sync:{ token:"", gistId:"", docsGistId:"", passphrase:"", auto:true, lastPush:null, lastPull:null, lastSeenVersion:"" },
  priorReturns:{ deepu:null, bhavana:null },  // extracted prior-year data + carry-forward candidates
  household:{ childrenMLS:0, hospitalCoverFullYear:false, coverDays:0 },
  people:{
    deepu:{ name:"", occ:"", residentFullYear:true, whm:false,
      salary:{gross:0, withheld:0, repFB:0, repSuper:0, allowances:0},
      other:{ interest:0, dividendsUnf:0, dividendsFr:0, frankingCr:0, frankingRate:30 },
      help:false, helpBalance:0, priorCapitalLosses:0, noiConfirmed:false, confirmNoReimburse:false, confirmSelfEdCurrent:false, confirmDGR:false,
      phi:{has:false, insurer:"", memb:"", rebateAsPremium:true, premiumsEligible:0, rebateReceived:0},
      seniorSAPTO:false,
      deductions:[] },
    bhavana:{ name:"", occ:"", residentFullYear:true, whm:false,
      salary:{gross:0, withheld:0, repFB:0, repSuper:0, allowances:0},
      other:{ interest:0, dividendsUnf:0, dividendsFr:0, frankingCr:0, frankingRate:30 },
      help:false, helpBalance:0, priorCapitalLosses:0, noiConfirmed:false, confirmNoReimburse:false, confirmSelfEdCurrent:false, confirmDGR:false,
      phi:{has:false, insurer:"", memb:"", rebateAsPremium:true, premiumsEligible:0, rebateReceived:0},
      seniorSAPTO:false,
      deductions:[] }
  },
  business:{
    abn:"", gstRegistered:false,
    uber:{ income:0, incomeIsGstExcl:true, km:0, method:"cpk", logbookPct:0, carActualTotal:0, expenses:[], psi:{ oneClient80:false, resultsTest:false, hasEmployees:false, premises:false, assessed:"" }, ncl:{}, nclBroughtFwd:null },
    meridian:{ income:0, expenses:[], psi:{ oneClient80:false, resultsTest:false, hasEmployees:false, premises:false, assessed:"" }, ncl:{}, nclBroughtFwd:null }
  },
  property:{
    address:"", shareDeepu:50,
    availableFrom:"2025-07-01", availableTo:"", weeksRented:52,

function deepMerge(base, over){

    const out=Array.isArray(base)?[]:Object.assign({}, base);
    for(const k in over){
      out[k]=(base && typeof base[k]==="object" && base[k]!==null && !Array.isArray(base[k]) && typeof over[k]==="object" && over[k]!==null && !Array.isArray(over[k]))

/* ================= TAX ENGINE ================= */
function baseTax(ti, pk){
  // Working holiday maker scale (no tax-free threshold; 15% to 45k then resident-style)
  if(pk && S.people[pk] && S.people[pk].whm){
    let t=0;
    if(ti<=45000) return ti*0.15;
    t=45000*0.15;
    if(ti<=135000) return t+(ti-45000)*0.30;
    t+=(135000-45000)*0.30;
    if(ti<=190000) return t+(ti-135000)*0.37;
    t+=(190000-135000)*0.37;
    return t+(ti-190000)*0.45;
  }
  // Non-resident for full year: no tax-free threshold, 30% from first dollar to 135k
  if(pk && S.people[pk] && S.people[pk].residentFullYear===false && !S.people[pk].whm){
    let t=0;
    if(ti<=135000) return ti*0.30;
    t=135000*0.30;
    if(ti<=190000) return t+(ti-135000)*0.37;
    t+=(190000-135000)*0.37;
    return t+(ti-190000)*0.45;
  }
  let tax=0, prev=0;
  for(const [cap,rate] of FY.brackets){ if(ti>prev){ tax += (Math.min(ti,cap)-prev)*rate; prev=cap; } else break; }
  return Math.max(0,tax);
}
function litoOff(ti){
  const L=FY.lito;
  if(ti<=L.full) return L.max;
  if(ti<=L.mid) return Math.max(0, L.max-(ti-L.full)*L.taper1);
  if(ti<=L.end) return Math.max(0, (L.max-(L.mid-L.full)*L.taper1)-(ti-L.mid)*L.taper2);
  return 0;
}
// Medicare levy with shade-in and family reduction.
// famReduction: if provided, uses the family lower/upper thresholds (couple + kids).
function medicare(ti, opts){
  opts=opts||{};
  if(S.people[opts.pk] && (S.people[opts.pk].residentFullYear===false)) return 0; // non-residents exempt
  // Family reduction path (only helps at low family income; harmless at high income)
  if(opts.familyIncome!=null){
    const kids=Math.max(0,num(S.household.childrenMLS));
    const lower=FY.medicareFamilyLower + kids*FY.medicarePerChild;
    const upper=FY.medicareFamilyUpper + kids*FY.medicarePerChild;
    const fam=opts.familyIncome;
    if(fam<=lower) return 0;
    if(fam<upper){
      // family shade-in: 10c per $ of family income over lower, apportioned to this person's share of family income
      const famLevy=(fam-lower)*FY.medicareShadeIn;
      const share = opts.familyIncome>0 ? ti/opts.familyIncome : 0;
      return Math.min(ti*FY.medicareRate, famLevy*share);
    }
    // above upper: full 2% each (fall through)
  }
  if(ti<=FY.medicareLowerSingle) return 0;
  if(ti<FY.medicareUpperSingle) return (ti-FY.medicareLowerSingle)*FY.medicareShadeIn; // shade-in 10c/$
  return ti*FY.medicareRate;
}
// HELP/STSL marginal repayment on repayment income
function helpRepayment(repayIncome, hasHelp){
  if(!hasHelp || repayIncome<=FY.help.thresholds[0][0]) return 0;
  const t=FY.help.thresholds;
  // top band: 10% of TOTAL repayment income
  if(repayIncome>t[2][0]) return repayIncome*0.10;
  if(repayIncome>t[1][0]) return t[1][2] + (repayIncome-t[1][0])*t[1][1]; // 8700 + 17% over 125k
  return (repayIncome-t[0][0])*t[0][1]; // 15% over 67k
}

/* ===== Division 35 non-commercial losses =====
   combined = this year's net result less any loss deferred from earlier years for the SAME activity.
   A loss can reduce other income only if (a) income for NCL purposes is under $250,000 AND
   (b) one of the four tests is passed (or the Commissioner exercised the discretion). Otherwise it is
   deferred and carried forward to the next year the activity makes a profit. */
function nclBroughtFwd(bk){
  const v=S.business[bk].nclBroughtFwd;
  if(v!==null && v!==undefined && v!=="") return num(v);
  const prev=priorFYCarry(); return prev&&prev.ncl? num(prev.ncl[bk]) : 0;
}
function bizResultRaw(bk){
  if(!bizOn(bk)) return {net:0, bf:0, combined:0};
  const net=bizNet(bk), bf=nclBroughtFwd(bk);
  return {net, bf, combined:net-bf};
}
function bizResult(bk, nclIncome){
  const r=bizResultRaw(bk); const b=S.business[bk]; const t=b.ncl||{};
  if(r.combined>=0) return Object.assign(r,{counted:r.combined, allowed:true, deferred:0, reason:r.bf>0?"Prior deferred loss of "+money(r.bf)+" absorbed by this year's profit.":""});
  const inc=num(b.income);
  const testPassed = inc>=20000 || t.profit3of5 || t.realProperty500k || t.otherAssets100k || t.discretion;
  const incomeOk = nclIncome<250000 || t.discretion;
  const allowed = testPassed && incomeOk;
  const reason = allowed ? (inc>=20000?"Assessable income test ($20,000+) passed.":"A Division 35 test is ticked as passed.")
    : (!incomeOk ? "Income for non-commercial loss purposes is about "+money(nclIncome)+", which is $250,000 or more, so the loss is deferred regardless of the four tests (unless the Commissioner grants a discretion)."
                 : "Assessable income of "+money(inc)+" is under $20,000 and no other Division 35 test is ticked, so the loss is deferred.");
  return Object.assign(r,{counted: allowed? r.combined : 0, allowed, deferred: allowed?0:-r.combined, reason, nclIncome});
}

function rentalNetTotal(){

function rentalShare(pk){
  const sh = pk==="deepu" ? num(S.property.shareDeepu)/100 : (100-num(S.property.shareDeepu))/100;
  return rentalNetTotal()*sh;
}
function cgtResult(){
  const p=S.property.sale;
  if(!modOn("rental")||!p.sold) return {gain:0, loss:0, discountEligible:false};
  const c=p.cost;
  const costBase=num(c.purchase)+num(c.stampDuty)+num(c.buyCosts)+num(c.improvements)+num(c.holdingNonDeductible)-num(c.cwClaimed)+num(p.sellingCosts);
  const raw=num(p.price)-costBase;
  // 50% CGT discount requires the asset to be held for MORE than 12 months (acquisition to disposal contract dates).
  const buy=p.purchaseDate?new Date(p.purchaseDate):null;
  const sell=p.contractDate?new Date(p.contractDate):null;
  let discountEligible=true, heldDays=null, holdKnown=false;
  if(buy&&!isNaN(buy)&&sell&&!isNaN(sell)){
    holdKnown=true;
    heldDays=Math.round((sell-buy)/86400000);
    discountEligible = heldDays>365; // strictly more than 12 months
  }
  if(raw>=0) return {gain:raw, loss:0, costBase, discountEligible, heldDays, holdKnown};
  return {gain:0, loss:-raw, costBase, discountEligible, heldDays, holdKnown};
}
function cgtForPerson(pk){
  const r=cgtResult();
  const sh = pk==="deepu" ? num(S.property.shareDeepu)/100 : (100-num(S.property.shareDeepu))/100;
  // prior capital losses are PER PERSON now
  let priorLoss = num(S.people[pk].priorCapitalLosses);
  if(!priorLoss){ const prev=priorFYCarry(); if(prev&&prev.capLoss&&num(prev.capLoss[pk])>0) priorLoss=num(prev.capLoss[pk]); }
  let gain=r.gain*sh, loss=r.loss*sh + priorLoss;

  // Discount only applies if held > 12 months. If dates unknown, default to eligible (most rentals are long-held)
  // but the Audit Shield warns that the hold period is unconfirmed.
  const discount = r.discountEligible ? FY.cgtDiscount : 0;
  if(gain>0){ const off=Math.min(gain,loss); gain-=off; loss-=off; netGain=gain>0? gain*(1-discount):0; }
  carried=loss;
  return {netGain, carried, discountApplied:discount>0, discountEligible:r.discountEligible, holdKnown:r.holdKnown, heldDays:r.heldDays};
}
// PHI rebate the person is ENTITLED to as a tax offset (only if NOT already taken as reduced premiums).
// Uses the rebate figure straight from the insurer statement (myTax prefills this), avoiding rate-regime maintenance.
function phiRebateOffset(pk){
  const P=S.people[pk];
  if(!P.phi.has || P.phi.rebateAsPremium) return 0;   // taken during year -> no offset (avoids double claim)
  return Math.max(0, num(P.phi.premiumsEligible));     // this field now holds the rebate amount from the statement

function personCalc(pk){
  const P=S.people[pk];
  const sal=num(P.salary.gross)+num(P.salary.allowances);
  // franking credit sanity cap: max credit = franked dividend × (rate ÷ (100−rate))
  //   30% company -> 30/70; base-rate-entity 25% company -> 25/75
  const frankedDiv=num(P.other.dividendsFr);
  const frankingRaw=num(P.other.frankingCr);
  const fr=(num(P.other.frankingRate)===25)?25:30;
  const frankingMax=Math.round(frankedDiv*(fr/(100-fr))*100)/100;
  const frankingCr=Math.min(frankingRaw, frankingMax>0?frankingMax:frankingRaw); // cap only if a franked div was entered
  const other=num(P.other.interest)+num(P.other.dividendsUnf)+frankedDiv+frankingCr;
  const rent=rentalShare(pk);
  const cg=cgtForPerson(pk);
  const ded=P.deductions.reduce((a,d)=>a+num(d.amount),0);
  // Division 35: work out which business losses may reduce other income. The $250k income
  // requirement is tested on income EXCLUDING the business losses themselves.
  let biz=0, ncl={};
  if(pk==="deepu"){
    const profits=["uber","meridian"].reduce((a,bk)=>{ const r=bizResultRaw(bk); return a+(r.combined>0?r.combined:0); },0);
    const preLossTaxable=Math.max(0, sal+other+profits+rent+cg.netGain-ded);
    const nclIncome=preLossTaxable+num(P.salary.repFB)+num(P.salary.repSuper)+(rent<0?-rent:0);
    ["uber","meridian"].forEach(bk=>{ ncl[bk]=bizResult(bk, nclIncome); biz+=ncl[bk].counted; });
  }
  const assessable=sal+other+biz+rent+cg.netGain;
  const taxable=Math.max(0, assessable-ded);
  const gross=baseTax(taxable, pk);
  const lito=P.residentFullYear===false?0:Math.min(litoOff(taxable),gross);
  // income for MLS purposes & HELP repay income & Div293 income all add back RFB, reportable super, net investment losses.
  // "Net investment loss" = net rental property loss + net financial investment loss. A BUSINESS loss is not one.
  const netInvLoss = (rent<0?-rent:0);
  const mlsIncome = taxable + num(P.salary.repFB) + num(P.salary.repSuper) + netInvLoss;
  const repayIncome = taxable + num(P.salary.repFB) + num(P.salary.repSuper) + netInvLoss;
  const help = helpRepayment(repayIncome, P.help);
  // Division 293: concessional contributions = employer SG (12% of gross salary) + reportable employer super
  //   (salary sacrifice) + personal deductible super (D12). Capped at the concessional cap for the excess test.
  const div293Income = taxable + num(P.salary.repFB) + num(P.salary.repSuper) + netInvLoss;
  const sgContrib = Math.round(num(P.salary.gross)*FY.sgRate*100)/100;
  const personalDeductibleSuper = P.deductions.filter(d=>d.cat==="D12"||/personal.*super|super.*contribution|concessional/i.test(d.label||"")).reduce((a,d)=>a+num(d.amount),0);
  const concessionalRaw = sgContrib + num(P.salary.repSuper) + personalDeductibleSuper;
  const concessional = Math.min(concessionalRaw, FY.concessionalCap); // Div293 applies to capped concessional
  const div293 = (div293Income>FY.div293.threshold && concessional>0)
    ? Math.round(Math.min(concessional, div293Income-FY.div293.threshold)*FY.div293.rate*100)/100 : 0;
  const overCap = Math.max(0, concessionalRaw - FY.concessionalCap);
  // Small business income tax offset (unincorporated small biz net income, services-type)
  let sbito=0;
  if(pk==="deepu"){
    // Net small business income excludes personal services income unless you are a personal services business.
    const sbEligible=bk=>!(bk==="meridian"&&!isRideshare(bk)&&S.business.meridian.psi.assessed!=="psb"&&!S.business.meridian.psi.resultsTest);
    const sbNet=["uber","meridian"].reduce((a,bk)=>a+(sbEligible(bk)?Math.max(0,(ncl[bk]||{}).counted||0):0),0);
    if(sbNet>0 && taxable>0){
      const taxOnSb = gross * Math.min(1, sbNet/taxable);
      sbito=Math.min(FY.sbito.cap, Math.round(taxOnSb*FY.sbito.rate*100)/100);
    }
  }
  const offsets=lito+sbito;
  const liability=Math.max(0,gross-offsets)+ /*medicare added in finalNumbers with family context*/ 0;
  const credits=num(P.salary.withheld)+frankingCr;
  return {sal,other,biz,ncl,rent,netCG:cg.netGain,carriedLoss:cg.carried,ded,taxable,gross,lito,sbito,
    mlsIncome,repayIncome,help,div293,concessional,overCap,frankingCr,frankingCapped:frankingRaw>frankingCr,
    netInvLoss,credits, grossLessOffsets:Math.max(0,gross-offsets)};
}
function mlsCalc(){
  const H=S.household;
  const d=personCalc("deepu"); const b=hasSpouse()?personCalc("bhavana"):null;
  if(H.hospitalCoverFullYear) return {rate:0, threshold:0, amounts:{deepu:0,bhavana:0}, combined:0};
  const family=hasSpouse();
  const combined=d.mlsIncome+(b?b.mlsIncome:0);
  const kids=Math.max(0,num(H.childrenMLS));
  // +$1,500 for each MLS dependent child AFTER the first
  const thr = family ? (FY.mls.familyBase + Math.max(0,kids-1)*FY.mls.perExtraChild) : FY.mls.single;
  const testIncome = family ? combined : d.mlsIncome;
  if(testIncome<=thr) return {rate:0, threshold:thr, amounts:{deepu:0,bhavana:0}, combined};

  const offset = family ? (thr-FY.mls.familyBase) : 0;
  const tiers = family ? FY.mls.tiers : (FY.mls.singleTiers||FY.mls.tiers);
  let rate=0.015;

  else if(testIncome<=tiers[1][0]+offset) rate=0.0125;

  const daysLiable=Math.max(0,yd-num(H.coverDays));
  const f=daysLiable/yd;

function parseJSONLoose(txt){

  const openCh=clean[0], closeCh=openCh==="["?"]":"}";
  const lastClose=clean.lastIndexOf(closeCh);
  if(lastClose>0){ try{ return JSON.parse(clean.slice(0,lastClose+1)); }catch(e){} }
  // 2) try the whole slice
  try{ return JSON.parse(clean); }catch(e){}

  //    partial token, and close any still-open strings/objects/arrays.

function repairTruncatedJSON(s){
  let inStr=false, esc=false; const stack=[];
  let safe=-1; // index (inclusive) of the last char where the JSON was structurally closeable

    const c=s[i];
    if(inStr){ if(esc){esc=false;} else if(c==="\\"){esc=true;} else if(c==='"'){inStr=false; if(stack.length) safe=i;} continue; }
    if(c==='"'){ inStr=true; }
    else if(c==="{"||c==="["){ stack.push(c==="{"?"}":"]"); }
    else if(c==="}"||c==="]"){ stack.pop(); safe=i; }
    else if(/[0-9tfnule.+-]/.test(c)){ if(stack.length) safe=i; } // inside a value token
  }
  if(safe<0) throw new Error("Could not repair truncated JSON");
  let out=s.slice(0, safe+1);
  // remove any trailing incomplete tail: dangling comma, "key", or "key":
  let prev;
  do{ prev=out;
    out=out.replace(/[,\s]+$/,"")
           .replace(/,?\s*"[^"]*"\s*:\s*$/,"")
           .replace(/,?\s*"[^"]*"\s*$/,"")
           .replace(/,\s*\{\s*$/,"")
           .replace(/,\s*\[\s*$/,"");
  } while(out!==prev);
  // recount open brackets on the trimmed string and close them
  const st2=[]; let ins=false, es=false;
  for(let i=0;i<out.length;i++){ const c=out[i];
    if(ins){ if(es)es=false; else if(c==="\\")es=true; else if(c==='"')ins=false; continue; }
    if(c==='"')ins=true; else if(c==="{")st2.push("}"); else if(c==="[")st2.push("]");
    else if(c==="}"||c==="]")st2.pop();
  }

  while(st2.length) out+=st2.pop();
  return out;
}

/* ===== Encrypted cross-device sync via a private GitHub Gist =====
   The full backup (state + documents) is encrypted in the browser with a passphrase
   using AES-GCM before it ever leaves the device. GitHub only ever stores ciphertext,
   so it cannot read your tax data. Push from one device, pull on another. */
/* Safe base64 for large byte arrays: spreading a big Uint8Array into String.fromCharCode
   overflows the call stack, so encode in chunks. */
function bytesToB64(bytes){
  let bin=""; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function b64ToBytes(b64){ const bin=atob(b64); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }

async function deriveKey(passphrase, saltB64){
  const enc=new TextEncoder();
  const salt = saltB64 ? b64ToBytes(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const baseKey=await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:120000, hash:"SHA-256" },
    baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  return { key, saltB64: bytesToB64(salt) };
}
async function encryptPayload(obj, passphrase){
  const { key, saltB64 } = await deriveKey(passphrase);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, data);
  return { v:1, alg:"AES-GCM", salt:saltB64, iv:bytesToB64(iv), ct:bytesToB64(new Uint8Array(ct)) };
}
async function decryptPayload(blob, passphrase){
  const { key } = await deriveKey(passphrase, blob.salt);
  const iv = b64ToBytes(blob.iv);
  const ct = b64ToBytes(blob.ct);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function syncPull(opts){

    persistSyncMeta();

async function syncPush(opts){
  opts=opts||{};

  if(syncBusy){ syncDirty=true; return; }
  syncBusy=true; syncDirty=false;
  try{
    const g=S.sync;
    syncStatus("Syncing...");
    // 1) if another device pushed since we last saw the gist, merge its changes first
    let remote=null;
    try{ remote=await readRemoteState(); }catch(e){ if(!/404/.test(e.message)) throw e; g.gistId=""; }
    if(remote&&remote.payload&&remote.version!==g.lastSeenVersion){ await applyRemote(remote.payload, g.docsGistId); }
    const remoteSigs=(remote&&remote.payload&&!remote.legacy&&remote.payload.docBuckets)||{};
    // 2) documents: re-send only buckets whose contents differ
    const {buckets, sigs}=await localDocBuckets();
    const changedB=Object.keys(Object.assign({},sigs,remoteSigs)).filter(k=>(sigs[k]||"")!==(remoteSigs[k]||""));
    const docFiles={}; let skipped=0;
    for(const k of changedB){
      if(!buckets[k]){ docFiles["docs_"+k+".enc.json"]=null; continue; }
      const files=[]; for(const r of buckets[k]){ try{ files.push({id:r.id,name:r.name,type:r.type,data:await blobToB64(r.blob)}); }catch(e){} }
      const enc=JSON.stringify(await encryptPayload({files}, g.passphrase));
      if(enc.length>9*1024*1024){ skipped+=files.length; sigs[k]=remoteSigs[k]||""; continue; }
      docFiles["docs_"+k+".enc.json"]={content:enc};
    }
    if(Object.keys(docFiles).length){
      if(!g.docsGistId){ const c=await gh("/gists",{method:"POST",body:JSON.stringify({description:SYNC_DOCS_DESC,public:false,files:Object.fromEntries(Object.entries(docFiles).filter(([k,v])=>v).concat([["README.txt",{content:"Encrypted TaxMax documents. Do not edit."}]]))})}); g.docsGistId=c.id; }
      else await gh("/gists/"+g.docsGistId,{method:"PATCH",body:JSON.stringify({files:docFiles})});
    }
    // 3) state: every FY workspace + register + settings
    const now=new Date().toISOString();
    const payload={ app:"TaxMax Command", version:3, pushedAt:now, workspaces:allWorkspaces(), assets:S.assets||[], cfg:S.cfg, cfgUpdatedAt:S.cfg.updatedAt||"",
      ai:{ mode:S.ai.mode, geminiKey:S.ai.geminiKey, geminiModel:S.ai.geminiModel, autoRead:S.ai.autoRead },
      docBuckets:sigs, docsGistId:g.docsGistId, links:{ fvPass:linksCfg().fvPass||"" } };
    const content=JSON.stringify(await encryptPayload(payload, g.passphrase));
    const files={"taxmax_state.enc.json":{content}};
    let res;
    if(!g.gistId) res=await gh("/gists",{method:"POST",body:JSON.stringify({description:SYNC_STATE_DESC,public:false,files})});
    else { if(remote&&remote.legacy) files["taxmax_sync.enc.json"]=null;
      res=await gh("/gists/"+g.gistId,{method:"PATCH",body:JSON.stringify({description:SYNC_STATE_DESC,files})}); }
    g.gistId=res.id; g.lastSeenVersion=(res.history&&res.history[0]&&res.history[0].version)||res.updated_at;
    g.lastPush=now; persistSyncMeta();
    syncStatus("Synced "+new Date().toLocaleTimeString()+(changedB.length?" ("+changedB.length+" document bundle(s) sent)":"")+(skipped?". "+skipped+" document(s) too large for sync: use the full backup for those":""), !!skipped);
    if(!opts.silent){ toast("Synced all years"+(changedB.length?" and documents":"")); render(); }
  }catch(e){ syncStatus("Sync failed: "+e.message,true); if(!opts.silent) toast("Sync failed: "+e.message,true); }
  finally{ syncBusy=false; if(syncDirty) scheduleAutoPush(); }
}

   encrypted with THIS app's sync passphrase. FinVault already keeps an encrypted household
   sync gist; TaxMax reads it with your FinVault passphrase. Both are read-only from here:
   nothing in DASH or FinVault is ever changed by TaxMax. */
const DASH_FEED_DESC="TaxMax feed: DASH (encrypted, do not edit)";

async function fvDecrypt(pass, enc){

  return JSON.parse(new TextDecoder().decode(bytes));
}

async function refreshLinks(opts){

/* Extra merchant rules for things the bank feed shows that are often work-related */
const FV_EXTRA_RULES=[
 {re:/anthropic|claude\.ai|openai|chatgpt|perplexity|github copilot/i, cat:"D5", why:"AI / software subscription (claim the work-use % only)"},
 {re:/nordvpn|nord account|expressvpn|1password|lastpass|bitwarden/i, cat:"D5", why:"Security software (work-use % only, keep a usage note)"},
 {re:/ugreen|anker|belkin|logitech|dell|lenovo|asus|samsung.*monitor/i, cat:"D5", why:"Possible work equipment (over $300 goes in the Asset Register)"},
 {re:/engineers australia|aipm|pmi\b|acs\b|cpa australia|ca anz|ahpra/i, cat:"D5", why:"Professional membership"}
];
/* Scan FinVault transactions for the active FY and add review items to the inbox.
   Repeat charges: once you accept a merchant (say a monthly AI subscription), later charges
   from it at a similar amount are added to the same claim at the same work-use %, so no
   month is forgotten. Once you say "Not a claim", the same charge is not asked again. */
function fvNear(a,b){ a=Math.abs(num(a)); b=Math.abs(num(b)); return Math.abs(a-b)<=Math.max(1, b*0.15); }
function fvRuleLine(rule){
  if(!rule||!rule.lineId) return null;
  if(rule.target==="shared") return (S.sharedBills||[]).find(b=>b.id===rule.lineId)||null;
  if(rule.target==="person") return ((S.people[rule.pk]||{}).deductions||[]).find(d=>d.id===rule.lineId)||null;
  const b=S.business[rule.target]; return b?((b.expenses||[]).find(e=>e.id===rule.lineId)||null):null;
}
function fvRuleLabel(rule){ return rule.base+" (bank feed"+(rule.n>1?", "+rule.n+" charges":"")+(rule.pct<100?", "+rule.pct+"% work use":"")+")"; }
function fvAbsorb(rule, x){
  const line=fvRuleLine(rule); if(!line) return false;
  const amt=Math.abs(num(x.amount));
  if(rule.target==="shared"){ line.annual=r2n(num(line.annual)+amt); rule.n=(rule.n||1)+1; rule.last=amt;
    line.fvNote=(line.fvNote||"")+" "+(x.date||"")+" "+money(amt,2)+";"; syncSharedBills(); return true; }
  line.amount=r2n(num(line.amount)+Math.round(amt*rule.pct)/100);
  rule.n=(rule.n||1)+1; rule.last=amt; line.label=fvRuleLabel(rule);
  line.notes=(line.notes||"")+" Plus "+(x.date||"")+" "+money(amt,2)+".";
  return true;
}
/* Car and Uber costs are claimed through DASH (with the logbook % or cents per km). A bank
   charge is left to DASH when: DASH has the same purchase (amount within 1%, within a week);
   or it is a toll top-up and DASH logs tolls; or it is fuel and DASH logs fuel; or it is a
   running car cost while DASH uses cents per km (which already includes fuel, rego, servicing,
   insurance and tyres, so they cannot be claimed separately). */
function dashCatFor(desc){
  if(/linkt|e-?toll|eastlink|citylink|transurban/i.test(desc)) return "tolls";
  if(/\b(bp|shell|ampol|caltex|7-eleven|united petrol|costco fuel|fuel|metro petroleum|liberty|puma energy|eg australia)\b/i.test(desc)) return "fuel";
  if(/car wash|carwash|detailing/i.test(desc)) return "carwash";
  if(/\b(rego|vicroads|service nsw.*regist|ctp|greenslip)\b/i.test(desc)) return "rego";
  if(/\b(nrma|aami|budget direct|youi|allianz).*(car|motor)|comprehensive/i.test(desc)) return "insurance";
  if(/tyre|tire|bmw|mechanic|service centre|ultra tune|midas|kmart tyre/i.test(desc)) return "service";
  if(/uber.*(service|fee)|rideshare fee/i.test(desc)) return "platform";
  if(/parking|wilson|secure parking|care park/i.test(desc)) return "parking";
  return "";
}
function dashCovers(x,d){
  if(!d) return false;
  const amt=Math.abs(num(x.amount)), xd=new Date(String(x.date||"").slice(0,10));
  const exp=d.expenses||[];
  if(exp.some(e=>Math.abs(num(e.amount)-amt)<=Math.max(0.5,amt*0.01)&&Math.abs((new Date(e.date)-xd)/86400000)<=7)) return true;
  const c=dashCatFor(x.desc||""); if(!c) return false;
  const has=exp.some(e=>e.cat===c);
  if(c==="tolls"&&has) return true;
  if(c==="fuel"&&has) return true;
  if(["fuel","rego","insurance","service","tyres"].indexOf(c)>=0&&d.car&&d.car.method==="cents") return true;
  return false;
}
function scanFinVault(){
  if(!LINKS.fvTxns||linksCfg().fv===false) return false;
  const tx=LINKS.fvTxns.map(t=>({date:String(t.date||"").slice(0,10), desc:String(t.description||""), amount:num(t.amount), fvCat:t.category||"", account:t.account||""}));
  S.finvault.txns=tx; S.finvault.linkedAt=LINKS.fvAt||"";
  const inRange=tx.filter(inFY).sort((a,b)=>a.date.localeCompare(b.date));
  const keyOf=f=>(f.date||"")+"|"+f.desc+"|"+num(f.amount).toFixed(2);
  const existing=new Set(S.finvault.flags.map(keyOf));

  const ruleFor={}, noFor={};
  S.finvault.flags.forEach(f=>{ if(f.rule&&f.rule.mk&&fvRuleLine(f.rule)) ruleFor[f.rule.mk]=f.rule;
    else if(f.status==="not a claim"){ const m=merchantKey(f.desc); if(m) (noFor[m]=noFor[m]||[]).push(f.amount); } });
  const d=dashActive()?dashFY():null;
  const inDash=(x)=>dashCovers(x,d);
  let added=0;
  // items already waiting in the inbox that DASH now covers are cleared
  S.finvault.flags.forEach(f=>{ if(f.status==="new"&&f.cat==="BIZ_UBER"&&d&&dashCovers({desc:f.desc, amount:-f.amount, date:f.date},d)){ f.status="handled in DASH"; f.auto=true; added++; } });
  inRange.forEach(x=>{
    if(x.amount>=0||x.fvCat==="Transfer") return;
    let hit=null;
    for(const r of FV_EXTRA_RULES){ if(r.re.test(x.desc)){ hit=r; break; } }
    if(!hit){ for(const r of FV_RULES){ if(r.re.test(x.desc)){ hit=r; break; } } }
    if(!hit) return;
    const f={date:x.date, desc:x.desc, amount:Math.abs(x.amount), cat:hit.cat, why:hit.why, status:"new", conf:"rule", src:"finvault", account:x.account};
    const k=keyOf(f); if(existing.has(k)||legacy.has(f.desc+"|"+f.amount)) return;
    const m=merchantKey(x.desc);
    const rule=m&&ruleFor[m];
    if(rule&&fvNear(f.amount,rule.last)&&fvAbsorb(rule,f)){
      f.status="added automatically to "+(rule.target==="person"?pname(rule.pk):rule.target==="shared"?"the shared bill":bizName(rule.target))+(rule.pct<100&&rule.target!=="shared"?" at "+rule.pct+"%":""); f.auto=true;
      S.finvault.flags.push(f); existing.add(k); added++; return;
    }
    if(m&&(noFor[m]||[]).some(a=>fvNear(f.amount,a))){ f.status="not a claim"; f.auto=true; S.finvault.flags.push(f); existing.add(k); added++; return; }
    if(alreadyClaimed({desc:x.desc, amount:x.amount, date:x.date})) return;
    if(f.cat==="BIZ_UBER"&&d){ if(inDash(x)) return; f.why="Car / Uber cost that is NOT in DASH. Add it in DASH so it is claimed once, with the logbook %."; f.dashMissing=true; }
    S.finvault.flags.push(f); existing.add(k); added++;
  });
  return added>0;
}

/* ===== Minimal store-only ZIP writer (no CDN, no compression) ===== */
function crc32(bytes){
  let c=~0; for(let i=0;i<bytes.length;i++){ c^=bytes[i]; for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); }
  return (~c)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function zipBuild(entries){ // entries: [{path, bytes}]
  const chunks=[], central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  entries.forEach(e=>{
    const nameB=strBytes(e.path), crc=crc32(e.bytes), sz=e.bytes.length;
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local), nameB, e.bytes);
    central.push({crc,sz,nameB,offset});
    offset += local.length+nameB.length+sz;
  });
  const cd=[]; let cdSize=0;
  central.forEach(c=>{
    const h=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.sz),u32(c.sz),u16(c.nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
    const arr=new Uint8Array(h.length+c.nameB.length); arr.set(h,0); arr.set(c.nameB,h.length);
    cd.push(arr); cdSize+=arr.length;
  });
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(cdSize),u32(offset),u16(0));
  const parts=[...chunks,...cd,new Uint8Array(end)];
  let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let o=0; parts.forEach(p=>{ out.set(p,o); o+=p.length; });
  return new Blob([out],{type:"application/zip"});
}
function safeName(s){ return String(s||"file").replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g," ").trim().slice(0,80); }

const PRIOR_PROMPT='This is an Australian individual tax return or notice of assessment from a PRIOR financial year. Extract it and identify (a) deductions that RECUR yearly and (b) depreciating ASSETS whose decline in value CONTINUES into later years. Respond ONLY with JSON: {"fy":"2023-24","person":"deepu|bhavana|unknown","taxableIncome":0,"totalDeductions":0,"deductionsFound":[{"atoLabel":"D1..D15/business/rental","label":"","amount":0,"workUsePct":0,"recurring":true}],"assets":[{"label":"","cost":0,"purchaseDate":"YYYY-MM-DD","workUsePct":0,"effectiveLifeYears":0,"immediateWriteOff":false}],"capitalLossCarried":0,"suggestions":["plain-English checks for this year"]}. Rules: In deductionsFound, recurring=true only for things people repeat every year (union/professional fees, income protection, tax agent fee D10, phone, internet, software subscriptions, donations to the same charity, WFH). recurring=false for one-offs. In assets, list ONLY depreciating items OVER $300 that continue to decline (desk, chair over $300, laptop, monitor); set immediateWriteOff=true and still list it if it was UNDER $300 or written off immediately (so we know NOT to claim it again). Use the ATO effective life if inferable (laptop 2, desktop 4, monitor 4, office chair 10, desk 20, printer 5, phone 3), else 0. capitalLossCarried = any net capital loss carried to later years. Amounts in AUD, GST-inclusive as shown. No markdown.';

/* ================= ASSET REGISTER (cross-year depreciation) =================
   One register shared by every FY workspace. Each asset's decline in value is worked out
   year by year from its cost, start date and effective life, so an item bought in March of one
   year is automatically pro-rated in that year and claimed in full in each later year until
   written off. The adjustable value falls by the FULL decline every year (private share included),
   and the deduction is decline x taxable-use %.
   Methods: pc = prime cost (straight line), dv = diminishing value (200%/life),
            pool = low-value pool (cost under $1,000: 18.75% first year, 37.5% after),
            instant = immediate deduction ($300-or-less work items; small business under the write-off limit). */
const EFFECTIVE_LIFE=[
  [/laptop|notebook|macbook|vivobook|surface/i,2,"Laptop"],[/tablet|ipad/i,2,"Tablet"],
  [/phone|iphone|pixel|galaxy/i,3,"Mobile phone"],[/monitor|screen|display/i,4,"Monitor"],
  [/desktop|pc tower|computer/i,4,"Desktop computer"],[/printer|scanner/i,5,"Printer"],
  [/chair/i,10,"Office chair"],[/desk|table/i,20,"Desk"],[/bookcase|shelf|shelving|filing|cabinet/i,20,"Office furniture"],
  [/router|modem|mesh|wifi/i,5,"Network equipment"],[/camera|webcam/i,3,"Camera"],[/headset|headphone/i,3,"Headset"],
  [/furniture|couch|sofa/i,13.33,"Freestanding furniture"],[/air ?con|heater|split system/i,10,"Air conditioner"]
];
function guessLife(label){ const m=EFFECTIVE_LIFE.find(e=>e[0].test(label||"")); return m?m[1]:0; }
function fyLabelOf(dateStr){
  const d=new Date(dateStr); if(isNaN(d)) return null;
  const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1; return y+"-"+String(y+1).slice(2);
}
function fyBounds(label){ const y=parseInt(label.slice(0,4),10); return {start:new Date(y+"-07-01T00:00:00"), end:new Date((y+1)+"-06-30T00:00:00")}; }
function nextFY(label){ const y=parseInt(label.slice(0,4),10)+1; return y+"-"+String(y+1).slice(2); }
function daysBetweenIncl(a,b){ return Math.round((b-a)/86400000)+1; }
function assetOwnerPcts(a){
  // returns {deepu:%, bhavana:%} for person owners, or {uber:%} / {meridian:%} for business owners
  if(a.owner==="both") return { deepu:num(a.pctDeepu), bhavana:num(a.pctBhavana) };
  return { [a.owner||"deepu"]: num(a.workPct)||0 };
}
function assetTaxablePct(a){ const p=assetOwnerPcts(a); return Math.min(100,Object.values(p).reduce((x,y)=>x+y,0)); }
function assetEligible(a){
  const cost=num(a.cost); const biz=(a.owner==="uber"||a.owner==="meridian");
  return {
    instant: biz ? cost < (FY_REGISTRY[fyLabelOf(a.purchaseDate)||"2025-26"]||FY).instantWriteOffSmallBiz : cost<=300,
    pool: cost>0 && cost<1000,
    pc: cost>0 && num(a.life)>0, dv: cost>0 && num(a.life)>0
  };
}
/* Full schedule, 100% basis. Returns [{fy, days, opening, decline, closing}] */
function assetSchedule(a, methodOverride){
  const method=methodOverride||a.method||"pc";
  const cost=num(a.cost), life=num(a.life);
  const startFY=fyLabelOf(a.purchaseDate); if(!startFY||cost<=0) return [];
  const disposed=a.disposedDate?new Date(a.disposedDate):null;
  const start=new Date(a.purchaseDate+"T00:00:00");
  const rows=[]; let value=cost, fy=startFY;
  for(let i=0;i<40 && value>0.005;i++){
    const b=fyBounds(fy); const yd=daysBetweenIncl(b.start,b.end);
    const from=i===0?start:b.start;
    let to=b.end; if(disposed && disposed<to) to=disposed;
    if(disposed && disposed<b.start) break;
    const days=Math.max(0,Math.min(yd,daysBetweenIncl(from,to)));
    let decline=0;
    if(method==="instant"){ decline= i===0 ? value : 0; }
    else if(method==="pool"){ decline = value*(i===0?0.1875:0.375); }
    else if(method==="dv"){ if(life>0) decline = value*(days/yd)*(2/life); }
    else { if(life>0) decline = cost*(days/yd)*(1/life); }
    decline=Math.min(value, Math.max(0,decline));
    rows.push({fy, days, opening:value, decline, closing:value-decline});
    value-=decline;
    if(disposed && disposed<=b.end) break;
    if(method==="dv" && value<1) { break; }
    fy=nextFY(fy);
  }
  return rows;
}
function assetYear(a, fyLabel, methodOverride){
  const r=assetSchedule(a, methodOverride).find(x=>x.fy===fyLabel);
  return r||{fy:fyLabel, days:0, opening:0, decline:0, closing:0};
}
/* Recommend the method that front-loads the most deduction (first two years), among eligible ones. */
function recommendMethod(a){
  const el=assetEligible(a); const fy0=fyLabelOf(a.purchaseDate); if(!fy0) return "pc";
  const fy1=nextFY(fy0);
  const score=m=>{ const s=assetSchedule(a,m); return s.filter(r=>r.fy===fy0||r.fy===fy1).reduce((x,r)=>x+r.decline,0); };
  const opts=["instant","pool","dv","pc"].filter(m=>el[m]);
  if(!opts.length) return "pc";
  return opts.sort((x,y)=>score(y)-score(x))[0];
}
const METHOD_LABEL={pc:"Prime cost",dv:"Diminishing value",pool:"Low-value pool",instant:"Immediate deduction"};
/* Items claimed with an older TaxMax (before the Asset Register existed) were saved as plain

function importLegacyAssets(){

      const st=startFrom(parseInt(m[3],10));

           purchaseDate:st.date, checkDate:st.check, docId:(b.docs||[])[0]||null, legacy:{fy, ref:"b_"+b.id, claimed:billClaim(b,"deepu")+billClaim(b,"bhavana")}});

/* Purchases over $300 sitting in an EARLIER year's Evidence Vault that are not in the register yet.
   The receipt reader saved vendor/date/total/assetLikely/effectiveLifeYears for each document. */
function vaultAssetCandidates(){
  const active=S.meta.activeFY||FY.label, skip=(S.cfg.vaultAssetSkip||{}), out=[], seen=new Set();
  const inReg=(id,cost,date)=>(S.assets||[]).some(a=>(id&&a.docId===id)||(num(a.cost)===num(cost)&&a.purchaseDate===date));
  const t=new Date(), ty=t.getMonth()>=6?t.getFullYear():t.getFullYear()-1, nowFY=ty+"-"+String((ty+1)%100).padStart(2,"0");
  knownFYs().filter(fy=>fy<active||fy<nowFY).forEach(fy=>{
    let ws=null; if(fy===active) ws=S; else { try{ ws=JSON.parse(localStorage.getItem(fyKey(fy))||"null"); }catch(e){} }
    ((ws&&ws.docs)||[]).forEach(d=>{
      const x=d.extract||{}; const total=num(x.total); const date=String(x.date||"").slice(0,10);
      if(!d.id||seen.has(d.id)||skip[d.id]||total<=300) return;
      if(x.isHouseholdBill||num(x.billPeriodMonths)>0) return;                       // bills and subscriptions are not assets
      const text=(x.summary||"")+" "+(x.vendor||"")+" "+(d.name||"");

        owner:(x.suggestedPerson==="bhavana"?"bhavana":"deepu"), pct:num(x.workUsePctGuess)||100});
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
/* The invoice for a register asset belongs in the Evidence Vault of EVERY year that claims part
   of it, so an audit of any one year has its proof. Files are stored once (shared by all years);
   each year's vault just lists it. Carried entries are marked and removed if no longer claimed. */
function findDocMeta(id){

function docUsedElsewhere(id){
  const active=S.meta.activeFY||"2025-26";
  if((S.assets||[]).some(a=>a.docId===id)) return true;
  return knownFYs().some(fy=>{ if(fy===active) return false; try{ const ws=JSON.parse(localStorage.getItem(fyKey(fy))||"null"); return !!(ws&&(ws.docs||[]).some(d=>d.id===id)); }catch(e){ return false; } });
}
function carryAssetDocs(){
  const fyl=S.meta.activeFY||FY.label; S.docs=S.docs||[]; const want={}; let changed=false;
  (S.assets||[]).forEach(a=>{
    if(!a.docId) return;
    const startFY=fyLabelOf(a.purchaseDate); if(!startFY||startFY>=fyl) return;     // bought this year: already in this vault
    if(assetYear(a,fyl).decline<=0) return;                                           // nothing claimed this year
    if(Object.entries(a.claimedYears||{}).some(([f,v])=>v==="full"&&f<fyl)) return;
    want[a.docId]=a;
  });
  Object.keys(want).forEach(id=>{
    const a=want[id], why="Decline in value claimed in FY"+fyl+": "+(a.label||"asset")+", bought "+a.purchaseDate+" for "+money(a.cost,2);
    let d=S.docs.find(x=>x.id===id);
    if(!d){ const f=findDocMeta(id); d=f?JSON.parse(JSON.stringify(f.meta)):{id, name:(a.label||"Asset")+" invoice", type:"", size:0, added:a.purchaseDate};
      d.carriedFrom=f?f.fy:fyLabelOf(a.purchaseDate); d.carriedFor=a.id; S.docs.push(d); changed=true; }
    if(d.carriedFor){ const c={target:a.owner, msg:why, when:a.purchaseDate}; if(JSON.stringify(d.claimed)!==JSON.stringify(c)){ d.claimed=c; changed=true; } }
  });
  const n=S.docs.length; S.docs=S.docs.filter(d=>!d.carriedFor||want[d.id]); if(S.docs.length!==n) changed=true;
  return changed;
}
/* Turn the register into this FY's deduction / business-expense lines (src "asset_<id>"). */
function syncAssetLines(){
  S.assets=S.assets||[];
  const fyl=S.meta.activeFY||FY.label;
  S.assets.forEach(a=>{ if(!a.updatedAt) a.updatedAt=new Date().toISOString(); });
  const want={}; // src -> {pk|bk, amount, label, notes, evidence, cat}
  S.assets.forEach(a=>{
    if(a.legacy&&a.legacy.fy===fyl) return; // lodged with the older app: that year's own line stands
    if(Object.entries(a.claimedYears||{}).some(([f,v])=>v==="full"&&f<fyl)) return; // fully claimed earlier: amend that year first
    const y=assetYear(a, fyl); if(y.decline<=0) return;
    const pcts=assetOwnerPcts(a);
    Object.keys(pcts).forEach(who=>{
      const pct=pcts[who]; if(pct<=0) return;
      const amt=Math.round(y.decline*pct)/100; if(amt<=0) return;
      const firstYear=fyLabelOf(a.purchaseDate)===fyl;
      want["asset_"+a.id+"_"+who]={who, amount:amt, cat:a.cat||"D5",
        label:(a.label||"Asset")+" (decline in value, "+METHOD_LABEL[a.method||"pc"]+(firstYear&&(a.method==="pc"||a.method==="dv"||!a.method)?", first year "+y.days+" days":"")+", "+pct+"% work use)",
        notes:"Asset register: cost "+money(a.cost)+", start "+a.purchaseDate+(a.method==="pool"||a.method==="instant"?"":", life "+a.life+"y")+". Opening value "+money(y.opening,2)+", decline "+money(y.decline,2)+", closing "+money(y.closing,2)+".",
        evidence:a.docId?[a.docId]:[]};
    });
  });
  ["deepu","bhavana"].forEach(pk=>{
    const P=S.people[pk];
    P.deductions=P.deductions.filter(d=>!String(d.src||"").startsWith("asset_") || (want[d.src]&&want[d.src].who===pk));
    Object.entries(want).filter(([k,v])=>v.who===pk).forEach(([src,v])=>{
      let d=P.deductions.find(x=>x.src===src);
      if(!d){ P.deductions.push({id:uid(), src, cat:v.cat, label:v.label, amount:v.amount, evidence:v.evidence.slice(), notes:v.notes}); }
      else { d.label=v.label; d.amount=v.amount; d.notes=v.notes; d.cat=v.cat; v.evidence.forEach(e=>{ d.evidence=d.evidence||[]; if(!d.evidence.includes(e)) d.evidence.push(e); }); }
    });
  });
  ["uber","meridian"].forEach(bk=>{
    const B=S.business[bk];
    B.expenses=B.expenses.filter(e=>!String(e.src||"").startsWith("asset_") || (want[e.src]&&want[e.src].who===bk));
    Object.entries(want).filter(([k,v])=>v.who===bk).forEach(([src,v])=>{
      let e=B.expenses.find(x=>x.src===src);
      if(!e) B.expenses.push({id:uid(), src, label:v.label, amount:v.amount, evidence:v.evidence.slice()});
      else { e.label=v.label; e.amount=v.amount; }
    });
  });
  try{ if(carryAssetDocs()) save({meta:true}); }catch(e){ console.error(e); }
}
/* Earlier-year slices that were never marked as claimed: these can only be recovered by amending that year. */
function assetMissedYears(a){
  const fyl=S.meta.activeFY||FY.label;
  return assetSchedule(a).filter(r=>r.fy<fyl && r.decline>0 && (a.claimedYears||{})[r.fy]!=="claimed")
    .map(r=>({fy:r.fy, amount:Math.round(r.decline*assetTaxablePct(a))/100, status:(a.claimedYears||{})[r.fy]||"unknown"}));
}
/* Back-compat for the prior-return analyser: this FY's prime-cost slice for an extracted asset. */
function primeCostCarry(a){
  const cost=num(a.cost), life=num(a.effectiveLifeYears), pct=num(a.workUsePct)||100;
  if(a.immediateWriteOff||cost<=300) return {claimable:0, done:true, reason:"Written off in full when purchased (under $300 or immediate deduction). Nothing to claim now."};
  if(!cost||!life) return {claimable:0, done:false, reason:"Need original cost and effective life to compute. Enter them below.", needInput:true};
  if(!a.purchaseDate||isNaN(new Date(a.purchaseDate))) return {claimable:0, done:false, reason:"Need the purchase date to compute remaining value.", needInput:true};
  const fake={cost, life, purchaseDate:String(a.purchaseDate).slice(0,10), method:a.method||"pc", owner:"deepu", workPct:pct};
  const y=assetYear(fake, S.meta.activeFY||FY.label);
  if(y.opening<=0) return {claimable:0, done:true, reason:"Effective life has ended: the asset is fully depreciated. Nothing left to claim.", openingValue:0};
  const claimable=Math.round(y.decline*pct)/100;
  return {claimable, done:false, openingValue:Math.round(y.opening*100)/100, closingValue:Math.round(y.closing*100)/100,
    reason:METHOD_LABEL[fake.method]+": "+money(cost)+" over "+life+" years. Opening value this FY "+money(y.opening)+". This year’s decline "+money(y.decline)+" at "+pct+"% work use = "+money(claimable)+"."};
}
