/* apply answer -> create/update deduction */
function applyAnswer(pk,qid,val){
  const q=QBANK.find(x=>x.id===qid); if(!q) return;
  S.interview.answers[pk+"_"+qid]=val;
  const P=S.people[pk];
  const amount=Math.round(q.calc(num(val))*100)/100;
  let d=P.deductions.find(x=>x.src===qid);
  if(num(val)<=0){ if(d) P.deductions=P.deductions.filter(x=>x.src!==qid); syncSharedBills(); save(); return; }
  if(!d){ d={id:uid(), src:qid, cat:q.cat, label:q.label, amount:amount, evidence:[], notes:(q.unit==="$"?"":num(val)+" "+q.unit)}; P.deductions.push(d); }
  else { d.amount=amount; d.notes=(q.unit==="$"?"":num(val)+" "+q.unit); }
  syncSharedBills(); save();
}

/* ---- Shared household bills (internet, phone, electricity, gas) ----
   One bill, two claimants. Each person claims annual x their own work-use %,
   under the ACTUAL COST method only. A person on the 70c fixed rate gets NO
   line from these bills because the rate already covers them. */
function onFixedRate(pk){ return S.people[pk].deductions.some(d=>d.src==="wfh"&&num(d.amount)>0); }
function billClaim(b,pk){ return Math.round(num(b.annual)*num(pk==="deepu"?b.pctDeepu:b.pctBhavana))/100; }
function syncSharedBills(){
  S.sharedBills=S.sharedBills||[];
  ["deepu","bhavana"].forEach(pk=>{
    const P=S.people[pk]; const fixed=onFixedRate(pk);
    // drop lines for deleted bills, or running-cost bills when this person switched to fixed rate
    // (kind "depr" = shared depreciating asset: decline in value is NOT covered by the 70c rate, so it survives)
    P.deductions=P.deductions.filter(d=>{
      if(!String(d.src||"").startsWith("sb_")) return true;
      const b=S.sharedBills.find(x=>"sb_"+x.id===d.src);
      return b && (b.kind==="depr"||!fixed) && billClaim(b,pk)>0;
    });
    S.sharedBills.forEach(b=>{
      if(fixed&&b.kind!=="depr") return;
      const amt=billClaim(b,pk); if(amt<=0) return;
      let d=P.deductions.find(x=>x.src==="sb_"+b.id);
      const pct=num(pk==="deepu"?b.pctDeepu:b.pctBhavana);
      const label=b.kind==="depr"
        ? b.label+" (decline in value share, "+pct+"% of "+money(b.annual)+" annual decline)"
        : b.label+" (actual cost, "+pct+"% work use of "+money(b.annual)+")";
      if(!d){ P.deductions.push({id:uid(), src:"sb_"+b.id, cat:"D5", label, amount:amt, evidence:(b.docs||[]).slice(), notes:b.kind==="depr"?(b.meta||"shared asset decline in value"):"shared household bill"}); }
      else { d.label=label; d.amount=amt; if((b.docs||[]).length) d.evidence=b.docs.slice(); if(b.kind==="depr"&&b.meta) d.notes=b.meta; }
    });
  });
}

/* ================= AUDIT SHIELD RULES ================= */
function runAudit(){
  const out=[]; const push=(sev,id,title,detail)=>out.push({sev,id,title,detail});
  const m=mlsCalc(); const dN=finalNumbers("deepu"), bN=finalNumbers("bhavana");
  // MLS exposure
  if(!S.household.hospitalCoverFullYear && m.rate>0){
    push("red","mls","Medicare levy surcharge exposure: "+(m.rate*100)+"%",
      "Combined MLS income about "+money(m.combined)+" exceeds the family threshold of "+money(m.threshold)+". Without private hospital cover for the full year you each pay MLS: Deepu about "+money(m.amounts.deepu)+", Bhavana about "+money(m.amounts.bhavana)+". A basic family hospital policy usually costs less. Extras-only cover does NOT count. Note for FY2026-27 planning: cover must be in place from 1 July.");
  }
  // GST exclusive income
  if(S.business.gstRegistered && !S.business.uber.incomeIsGstExcl){
    push("red","gstexcl","Uber income must be GST-exclusive in the tax return",
      "As a GST-registered rideshare driver, report business income NET of GST in the income tax return. Gross fares divided by 11 is the GST that belongs on the BAS, not here. Same for expenses: claim the GST-exclusive amount if you claimed the credit on a BAS.");
  }
  if(num(S.business.uber.income)>0 && !S.business.gstRegistered){
    push("red","gstreg","Rideshare requires GST registration from dollar one",
      "There is no $75k threshold for rideshare. If you drove for Uber while unregistered, fix this before lodging.");
  }
  // cents per km at cap
  if(S.business.uber.method==="cpk" && num(S.business.uber.km)>=FY.cpkCap){
    push("amber","cpkcap","Business km at or above the 5,000 km cap",
      "You are capped at $"+(FY.cpkCap*FY.centsPerKm).toFixed(0)+". If real rideshare km are well above 5,000, a 12-week logbook plus actual costs (fuel, rego, insurance, depreciation, servicing at business-use %) usually gives a much larger, fully defensible claim. Claims of exactly 5,000 km with no diary basis are a known ATO flag.");
  }
  // Uber income vs km plausibility
  if(num(S.business.uber.income)>0 && num(S.business.uber.km)>0){
    const perKm=num(S.business.uber.income)/num(S.business.uber.km);
    if(perKm>6||perKm<0.5) push("amber","uberplaus","Uber income vs km looks unusual",
      "Income of "+money(S.business.uber.income)+" over "+num(S.business.uber.km)+" km is "+perKm.toFixed(2)+" $/km. The ATO data-matches Uber's reports to your return. Confirm both figures against the Uber annual tax summary.");
  }
  // Meridian PSI
  const mer=S.business.meridian;
  if(num(mer.income)>0 && mer.psi.assessed!=="psb"){
    push(mer.psi.oneClient80?"red":"amber","psi","Personal services income rules likely apply to Meridian",
      "Advisory fees earned mainly from your personal skills are PSI. Unless you pass the results test or the 80/20 plus unrelated-clients tests, PSI rules limit deductions (no home occupancy costs, no income splitting) and the income is attributed to you personally. Run the PSI wizard in the Business tab and keep the assessment with your records."+(mer.psi.oneClient80?" You flagged that one client provides 80%+ of PSI: the unrelated clients test is failed, so you are NOT a personal services business unless the results test is met.":""));
  }
  // Non-commercial loss (Division 35): uses the engine's verdict, which the refund estimate already follows
  { const dc=personCalc("deepu");
    ["uber","meridian"].forEach(bk=>{
      if(!bizOn(bk)) return;
      const r=(dc.ncl||{})[bk]; if(!r) return;
      if(r.combined<0){
        push(r.allowed?"amber":"red","ncl_"+bk,bizName(bk)+": "+(r.allowed?"business loss of "+money(-r.combined)+" is being offset against other income":"business loss of "+money(-r.combined)+" is DEFERRED (Division 35)"),
          r.reason+" "+(r.allowed?"Keep the evidence for the test you rely on.":"The estimate already excludes this loss from your taxable income; it carries forward and is used the next year "+bizName(bk)+" makes a profit. At the non-commercial loss question in myTax, report it as deferred. Note: if the activity has stopped for good, a deferred loss can only be used if you restart the same or a similar business.")+
          (r.bf>0?" Includes "+money(r.bf)+" deferred from earlier years.":""));
      } else if(r.bf>0){
        push("teal","nclbf_"+bk,bizName(bk)+": "+money(r.bf)+" of earlier deferred losses used this year", r.reason);
      }
    });
  }
  // Fixed rate + phone double dip
  ["deepu","bhavana"].forEach(pk=>{
    const P=S.people[pk];
    const hasWFH=P.deductions.some(d=>d.src==="wfh"&&num(d.amount)>0);
    const phoneish=P.deductions.some(d=>/phone|internet|mobile|data|electric|energy|gas/i.test(d.label)&&d.src!=="wfh"&&!/decline in value/i.test(d.label+" "+(d.notes||"")));
    if(hasWFH&&phoneish) push("red","dd_"+pk,P.name+": running costs claimed on top of the WFH fixed rate",
      "The 70c fixed rate ALREADY covers phone, internet, electricity, gas and stationery. Claiming them separately is double dipping, one of the ATO's top audit triggers. Either drop the separate claim or switch to the actual cost method with records.");
    // evidence check
    P.deductions.filter(d=>num(d.amount)>300&&(!d.evidence||!d.evidence.length)).forEach(d=>{
      push("amber","ev_"+d.id,P.name+": no evidence linked to \""+esc(d.label)+"\" ("+money(d.amount)+")",
        "Work expenses over $300 total require written evidence kept 5 years. Upload the receipt/invoice/diary to the Evidence Vault and link it, then this flag clears.");
    });
    // round numbers
    const rounds=P.deductions.filter(d=>num(d.amount)>=200&&num(d.amount)%100===0).length;
    if(rounds>=3) push("amber","round_"+pk,P.name+": several suspiciously round deduction amounts",
      rounds+" deductions are exact multiples of $100. Real receipts rarely are. Use the actual receipt amounts, the ATO's models score round-number clusters.");
    const wre=["D1","D2","D3","D4","D5"].reduce((a,c)=>a+personDeductionTotal(pk,c),0);
    if(wre>6000) push("amber","wre_"+pk,P.name+": work-related expenses of "+money(wre)+" are above occupation averages",
      "Not a problem if genuine, but every dollar needs a receipt or a compliant record. The ATO compares against others in the same occupation code and income band. Double-check apportionment percentages are defensible.");
    // Personal super deduction (D12) requires a Notice of Intent acknowledgment
    const superD12=personDeductionTotal(pk,"D12");
    if(superD12>0 && !P.noiConfirmed)
      push("red","noi_"+pk,P.name+": personal super deduction of "+money(superD12)+" has no Notice of Intent confirmation",
        "A personal super contribution is ONLY deductible if you lodged a Notice of Intent with your fund AND received written acknowledgment before lodging (or before starting a pension/withdrawal). Without it the deduction is invalid and the ATO will disallow the full amount. Tick the confirmation box under the super question in Claim Finder once you hold the acknowledgment letter.");
    // Reimbursement check on car/travel
    const carTravel=personDeductionTotal(pk,"D1")+personDeductionTotal(pk,"D2");
    if(carTravel>0 && !P.confirmNoReimburse)
      push("amber","reimb_"+pk,P.name+": confirm car/travel costs were not reimbursed",
        "You have "+money(carTravel)+" of car/travel deductions. A cost your employer reimbursed is not deductible, this is one of the ATO's most common adjustments. Tick the confirmation under the car/travel question in Claim Finder.");
    // Self-education career-change screen
    const selfEd=personDeductionTotal(pk,"D4");
    if(selfEd>0 && !P.confirmSelfEdCurrent)
      push("amber","selfed_"+pk,P.name+": confirm self-education relates to your CURRENT job",
        "You have "+money(selfEd)+" of self-education. It is only deductible if it maintains or improves the skills for your current role. Study to get a new job or change careers is not deductible. Tick the confirmation under the self-education question.");
    // DGR check on donations
    const donations=personDeductionTotal(pk,"D9");
    if(donations>0 && !P.confirmDGR)
      push("amber","dgr_"+pk,P.name+": confirm donations were to a Deductible Gift Recipient",
        "You have "+money(donations)+" of gifts/donations. Only gifts to endorsed DGRs are deductible. Check the recipient at abn.business.gov.au. Some church and building funds are DGRs and some are not. Tick the confirmation under the donations question.");

    /* ===== PLAUSIBILITY LAYER (flags outliers, never claims a figure is "true", never auto-corrects) ===== */
    const pc=personCalc(pk);
    const income=Math.max(0, pc.sal+pc.biz+pc.rent); // income the deductions relate to
    const totalDed=pc.ded;
    // 1) Deduction-to-income ratio outlier (total). ATO risk models watch this exact ratio.
    if(income>0 && totalDed>0){
      const ratio=totalDed/income;
      if(ratio>0.25 && totalDed>3000)
        push("amber","ratio_"+pk,P.name+": total deductions are "+Math.round(ratio*100)+"% of income, unusually high",
          money(totalDed)+" of deductions against "+money(income)+" of income. This is well above typical and is exactly the ratio the ATO's models score. Not necessarily wrong, but check for a decimal-point slip and make sure every claim is genuine and substantiated.");
    }
    // 1b) Per-category ratio outliers for the categories that most often hide a typo
    [["D1","car",0.06],["D4","self-education",0.10],["D9","donations",0.10]].forEach(([cat,name,thr])=>{
      const v=personDeductionTotal(pk,cat);
      if(income>0 && v>1000 && v/income>thr)
        push("amber","catratio_"+pk+"_"+cat,P.name+": "+name+" of "+money(v)+" looks high for the income",
          "That is "+Math.round(v/income*100)+"% of income in one category. Common causes are a decimal-point error (e.g. "+money(v)+" entered instead of "+money(v/10)+") or double entry. Confirm the figure, or acknowledge with a note.");
    });
    // 2) Order-of-magnitude outlier: one deduction line dwarfs the others (likely a typo)
    const amts=P.deductions.map(d=>num(d.amount)).filter(a=>a>0).sort((a,b)=>b-a);
    if(amts.length>=3 && amts[0] >= amts[1]*8 && amts[0]>2000)
      push("amber","mag_"+pk,P.name+": one deduction is far larger than all the others",
        "Your largest deduction ("+money(amts[0])+") is more than 8x your next largest ("+money(amts[1])+"). That gap is often a typo (an extra zero) or a figure entered in the wrong field. Open the deductions ledger and confirm it.");
    // 3) HARD consistency checks (these are arithmetic impossibilities, stated firmly)
    const kmAns=num(S.interview.answers[pk+"_car"]);
    if(kmAns>5000)
      push("red","kmcap_"+pk,P.name+": car claim entered as "+kmAns+" km exceeds the 5,000 km cents-per-km cap",
        "The cents-per-km method is capped at 5,000 km ("+money(5000*FY.centsPerKm)+"). Kilometres above that cannot be claimed this way, you would need the logbook method (business-use % of actual costs) with a 12-week logbook. The tool caps the claim at 5,000 km regardless.");
    const wfhHrs=num(S.interview.answers[pk+"_wfh"]);
    if(wfhHrs>3600)
      push("red","wfhhrs_"+pk,P.name+": "+wfhHrs+" work-from-home hours is more than a full-time year",
        "A full-time year is roughly 1,800 to 2,000 working hours. "+wfhHrs+" hours is not plausible and looks like a data-entry error. The ATO denies fixed-rate WFH claims that are not backed by a genuine hours record. Re-check the figure.");
    // work-use % over 100 on any shared bill
    (S.sharedBills||[]).forEach(b=>{ const p=num(pk==="deepu"?b.pctDeepu:b.pctBhavana);
      if(p>100) push("red","pct_"+pk+"_"+b.id,P.name+": work-use % on \""+esc(b.label)+"\" is over 100%",
        "A work-use percentage cannot exceed 100%. Fix it in the shared bills panel."); });
    // 4) Evidence-threshold triggers: total WRE over $300 needs written evidence; laundry over $150
    if(wre>300){
      const wreDocs=P.deductions.filter(d=>["D1","D2","D3","D4","D5"].includes(d.cat)&&(d.evidence||[]).length>0).length;
      const wreLines=P.deductions.filter(d=>["D1","D2","D3","D4","D5"].includes(d.cat)&&num(d.amount)>0).length;
      if(wreLines>0 && wreDocs<wreLines)
        push("amber","evthr_"+pk,P.name+": work expenses exceed $300, so written evidence is required for all of them",
          "Once total work-related expenses pass $300 the ATO requires written evidence for the WHOLE amount, not just the excess. "+(wreLines-wreDocs)+" of your "+wreLines+" work deduction lines have no document linked. Attach receipts in the Evidence Vault.");
    }
    const laundry=P.deductions.filter(d=>/laundry|washing|uniform clean/i.test(d.label||"")).reduce((a,d)=>a+num(d.amount),0);
    if(laundry>150){
      const laundryDocs=P.deductions.filter(d=>/laundry|washing|uniform clean/i.test(d.label||"")&&(d.evidence||[]).length>0).length;
      if(laundryDocs===0)
        push("amber","laundry_"+pk,P.name+": laundry claim of "+money(laundry)+" is over the $150 evidence-free limit",
          "Laundry can be claimed without receipts only up to $150 (at the ATO's rates). Above $150 you need written evidence and a reasonable basis. Either bring it under $150 if that reflects reality, or keep records.");
    }
    // POSSIBLE DOUBLE-CLAIM: an interview answer AND evidence-sourced lines in the same category
    Object.keys(QMATCH).forEach(qid=>{
      const interviewLine=P.deductions.find(d=>d.src===qid&&num(d.amount)>0);
      if(!interviewLine) return;
      const ev=evidenceClaimsFor(pk, qid);
      if(ev.total>0) push("amber","dc_"+pk+"_"+qid,P.name+": possible double claim of "+QMATCH[qid].label,
        "You entered "+money(interviewLine.amount)+" in the Claim Finder for "+QMATCH[qid].label+", AND "+money(ev.total)+" is already claimed from documents ("+ev.items.map(i=>i.label).join(", ")+"). If the interview figure includes those same receipts, reduce it so each dollar is claimed once.");
    });
  });
  // Shared household bills & assets: two claimants, one bill
  (S.sharedBills||[]).forEach(b=>{
    const isAsset=b.kind==="depr";
    const dOn=isAsset||!onFixedRate("deepu"), bOn=isAsset||!onFixedRate("bhavana");
    const tot=(dOn?num(b.pctDeepu):0)+(bOn?num(b.pctBhavana):0);
    if(tot>100) push("red","sb100_"+b.id,"\""+esc(b.label)+"\": combined work-use claims exceed the whole "+(isAsset?"asset":"bill"),
      "Deepu "+num(b.pctDeepu)+"% + Bhavana "+num(b.pctBhavana)+"% = "+tot+"% of one "+(isAsset?"asset":"bill")+". You cannot jointly claim more than 100% of an expense, and in practice far less, because the household also uses it privately. Fix the percentages.");
    else if(tot>70&&!isAsset) push("amber","sb70_"+b.id,"\""+esc(b.label)+"\": combined "+tot+"% work use will need strong records",
      "Two people claiming "+tot+"% of a household bill implies almost no private use, yet the family streams, browses, games and runs the home on it every evening, weekend and holiday. The ATO benchmarks internet work-use around 30-60% per household. Keep a 4-week diary per person or trim the percentages.");
    else if(tot>85&&isAsset) push("amber","sb85_"+b.id,"\""+esc(b.label)+"\": combined "+tot+"% work use on a shared asset",
      "High but possible for genuinely dedicated office equipment. If the item lives in a home office and is basically never used privately, keep a note saying exactly that with the receipt. If the kids also use it, trim the percentages.");
    if(/electric|energy|gas/i.test(b.label)&&!isAsset&&tot>0&&(dOn||bOn)) push("amber","sbEn_"+b.id,"Energy bill claimed at actual cost: records basis required",
      "For electricity/gas under the actual cost method the ATO expects a calculation, not a vibe: hours worked at home x appliance/heating/cooling/lighting cost per hour, or a 4-week representative diary. Whole-of-bill percentages without that working rarely survive review. If the workings are painful, the 70c fixed rate may be safer for the energy component.");
    if(/mobile/i.test(b.label)&&num(b.pctDeepu)>0&&num(b.pctBhavana)>0) push("amber","sbMob_"+b.id,"\""+esc(b.label)+"\": both people claiming one mobile plan",
      "A personal mobile belongs to one person. Only the account holder/user claims their work-use share; set the other person to 0%. Family plans can be split, but only by who uses which service.");
  });
  const r=S.property.rental;
  if(num(r.repairs)>2000) push("amber","repairs","Repairs of "+money(r.repairs)+": confirm none are capital improvements",
    "Replacing like-with-like after tenant damage is a repair (deductible now). Improvements, renovations, or fixing defects that existed at purchase are capital (depreciated at 2.5% or added to cost base). Repairs made just before or after sale, or shortly after purchase, are classic audit targets.");
  if(S.property.sale.sold && rentalNetTotal()!==0 && num(S.property.weeksRented)>=52)
    push("amber","apport","Property sold during the year but expenses look like a full year",
      "Interest, rates and insurance are only deductible while the property was rented or genuinely available for rent. Apportion to the date it left the rental pool (or settlement). Post-sale interest is not deductible.");
  if(num(r.interest)>0 && num(r.interest)>num(r.rent)*1.5)
    push("amber","interest","Interest is very high relative to rent",
      "Fine if genuinely negative geared, but confirm the loan was used solely for the rental (no redraws for private purposes: those portions are not deductible). Keep loan statements for the full year.");
  const cg=cgtResult();
  if(S.property.sale.sold && num(S.property.sale.price)>0 && cg.loss>0)
    push("teal","cgloss","Capital loss of "+money(cg.loss)+" locked in: carry it forward, never against salary",
      "Capital losses only offset capital gains (this year or any future year). Record the calculation and keep contracts, stamp duty and agent invoices permanently. Also confirm capital works deductions claimed over the years were subtracted from cost base, the ATO checks this.");
  if(S.property.sale.sold && !S.property.sale.contractDate)
    push("amber","cgdate","CGT year is set by CONTRACT date, not settlement",
      "If contracts exchanged on or before "+fyEndText()+" the CGT event is in FY"+FY.label+" even if settlement is later. Enter the contract date in the Property tab.");
  // CGT 50% discount hold-period checks
  if(S.property.sale.sold && num(S.property.sale.price)>0 && cg.gain>0){
    if(!cg.holdKnown)
      push("amber","cghold","CGT 50% discount: confirm the property was held more than 12 months",
        "The 50% discount only applies if the asset was held for MORE than 12 months between the purchase and sale contract dates. Enter both dates in the Property tab so the tool can verify it. Right now the discount is being applied on the assumption it was long-held; if it was bought and sold within 12 months, no discount applies and the gain is taxed in full.");
    else if(!cg.discountEligible)
      push("red","cgnodisc","No CGT discount: property held 12 months or less ("+(cg.heldDays!=null?cg.heldDays+" days":"")+")",
        "Held for "+(cg.heldDays!=null?cg.heldDays+" days":"under a year")+", which is not more than 12 months, so the 50% CGT discount does NOT apply and the whole gain is assessable. The tool has removed the discount. Claiming it would be a straightforward ATO adjustment.");
  }
  // timing
  const today=new Date();
  if(today<new Date(FY.end.slice(0,4)+"-07-25") && today>new Date(FY.end))
    push("teal","prefill","Do not lodge before ATO prefill is ready (late July)",
      "Income statements, bank interest, business data-match, private health and dividend data flow into myTax through July. Lodging early with a missing amount is the #1 cause of amended assessments for self-lodgers. Wait until income statements show 'Tax ready', then reconcile every prefilled figure against this tool.");
  { const due=new Date(FY.end.slice(0,4)+"-10-31T23:59:59"); const days=Math.ceil((due-today)/86400000);
    if(today>new Date(FY.end) && days>=0 && days<=30)
      push("amber","deadline","Self-lodgment due in "+days+" day"+(days===1?"":"s")+" ("+lodgeDueText()+")",
        "If you are lodging FY"+FY.label+" yourself it must be in by "+lodgeDueText()+". If you cannot finish properly in time, a registered tax agent can add you to their lodgment program before that date, which usually moves your due date to 15 May. Lodging late without an agent risks failure-to-lodge penalties if tax is payable."); }
  if(modOn("rental")) push("teal","smsf","An SMSF-held property does NOT go in a personal return",
    "If you hold property inside a self-managed super fund, it belongs in the SMSF annual return, which legally requires an approved SMSF auditor before lodgment. That cannot be self-lodged unaudited, budget for it separately.");
  // payg instalments heads-up
  if(bizNet("uber")+bizNet("meridian")+ (rentalNetTotal()>0?rentalNetTotal():0) > 4000)
    push("teal","payg","Expect PAYG instalments after this return",
      "With business/investment income above the threshold the ATO will likely enter you into quarterly PAYG instalments. Not a penalty, just cashflow: plan for it.");
  // Per-person new-engine flags
  activePeople().forEach(pk=>{
    const c=finalNumbers(pk); const P=S.people[pk];
    if(c.div293>0) push("amber","d293_"+pk,pname(pk)+": extra tax on super may apply (Division 293), about "+money(c.div293),
        "Because income for surcharge purposes is over $250,000, an extra 15% applies to concessional (before-tax) super contributions. We calculated this automatically from salary, reportable super, and any personal deductible contribution. It is assessed separately by the ATO and not withheld by your employer, so set the cash aside.");
    if(c.help>0) push("teal","help_"+pk,pname(pk)+": HELP/study loan repayment of "+money(c.help),
      "Calculated on the 2025-26 marginal system (15c per $ over $67,000, rising in higher bands). This reduces your refund or adds to a bill even though it is a debt repayment, not a tax. Confirm your loan balance in myGov.");
    if(c.frankingCapped) push("amber","frank_"+pk,pname(pk)+": franking credits look too high for the franked dividend entered",
      "The franking credit cannot exceed 30/70 of the franked dividend amount. The tool has capped it. Check you did not swap the dividend and credit fields, or enter the credit as the dividend.");
    if(P.phi.has && !P.phi.rebateAsPremium && num(P.phi.premiumsEligible)>0) push("amber","phi_"+pk,pname(pk)+": claiming the private health rebate in the return",
      "You have marked the rebate as claimed via the tax return, so the tool adds it as an offset. Make sure you did NOT also receive it as reduced premiums during the year, or you will be claiming it twice. Your health fund statement shows which you chose.");
    if(P.residentFullYear===false) push("amber","res_"+pk,pname(pk)+": taxed as a non-resident / part-year resident",
      "No tax-free threshold and different rates apply, and the Medicare levy does not. Part-year residents get a pro-rata tax-free threshold that this tool does not compute precisely, verify in myTax if your residency changed mid-year.");
    if(c.overCap>0) push("amber","cap_"+pk,pname(pk)+": concessional super contributions of "+money(c.concessional+c.overCap)+" exceed the "+money(FY.concessionalCap)+" cap",
      "Estimated concessional contributions (12% employer SG + salary sacrifice + personal deductible super) are about "+money(c.overCap)+" over the cap. Excess concessional contributions are added to your assessable income and taxed at your marginal rate (with a 15% offset), plus an interest charge. If your total super balance was under $500,000 at 30 June 2025 you may have unused carry-forward cap from prior years that raises your personal cap, check myGov before assuming an excess.");
  });
  // Linked apps (DASH + FinVault)
  { const dd=dashActive()?dashFY():null;
    if(dd){
      ((dd.checks&&dd.checks.errors)||[]).slice(0,6).forEach((e,i)=>push("red","dashe_"+i,"DASH: "+String(e).slice(0,80)+(String(e).length>80?"...":""),String(e)+" Fix it in DASH; the figures here update by themselves."));
      ((dd.checks&&dd.checks.warns)||[]).slice(0,4).forEach((e,i)=>push("amber","dashw_"+i,"DASH: "+String(e).slice(0,80)+(String(e).length>80?"...":""),String(e)));
      const pi=num((dd.other.byCat||{}).phone)+num((dd.other.byCat||{}).internet);
      const empPI=S.people.deepu.deductions.filter(x=>/phone|internet|mobile|nbn|broadband/i.test((x.label||"")+" "+(x.notes||""))&&!/decline/i.test(x.label||"")).reduce((a,x)=>a+num(x.amount),0)
        +(S.sharedBills||[]).filter(b=>/phone|internet|mobile|nbn|broadband/i.test(b.label||"")&&b.kind!=="depr").reduce((a,b)=>a+billClaim(b,"deepu"),0);
      if(pi>0&&(empPI>0||onFixedRate("deepu"))) push("amber","dashpi","Phone/internet claimed in DASH and as an employee",
        "DASH claims "+money(pi)+" of phone and internet for Uber, and your employee claims "+(onFixedRate("deepu")?"use the 70c fixed rate, which already includes phone and internet for your working-from-home hours":"also include "+money(empPI)+" of phone or internet")+". Both are allowed only if they cover different slices of use: Uber % + employment % + private % must come to 100% of each bill, based on one usage diary. Check the % in DASH (Settings) and here.");
    }
    const missing=S.finvault.flags.filter(f=>f.dashMissing&&f.status==="new");
    if(missing.length) push("teal","fvdash",missing.length+" car or Uber cost"+(missing.length===1?"":"s")+" in your bank feed "+(missing.length===1?"is":"are")+" not in DASH",
      "Total "+money(missing.reduce((a,f)=>a+num(f.amount),0),2)+". If they relate to the Uber car, add them in DASH so the logbook % is applied once. They are listed in the Tax inbox.");
    const inbox=S.finvault.flags.filter(f=>f.status==="new"&&!f.dashMissing).length;
    if(inbox) push("teal","fvinbox",inbox+" bank transaction"+(inbox===1?"":"s")+" might be claimable","Review them in the Tax inbox: accept with the right work-use %, or mark them as not a claim.");
    activePeople().forEach(pk=>{ const need=S.people[pk].deductions.filter(x=>x.needsReceipt&&!(x.evidence||[]).length&&num(x.amount)>0);
      if(need.length) push("amber","rcpt_"+pk,pname(pk)+": "+need.length+" claim"+(need.length===1?"":"s")+" from the bank feed need a receipt",
        "A bank statement shows you paid, not what you bought. Upload the receipt or tax invoice for: "+need.slice(0,5).map(x=>x.label.split(" (")[0]+" "+money(x.amount,2)).join(", ")+(need.length>5?" and "+(need.length-5)+" more":"")+". Link it in the Deductions tab."); });
  }
  // Asset register checks
  (S.assets||[]).forEach(a=>{
    assetMissedYears(a).forEach(x=>{
      if(x.status==="not") push("amber","amiss_"+a.id+"_"+x.fy,"\""+esc(a.label)+"\": FY"+x.fy+" decline of "+money(x.amount)+" was not claimed: amend that return",
        "The decline for FY"+x.fy+" can't be moved into this year. Lodge an amendment for FY"+x.fy+" in myTax (Manage returns > Amend) while you're inside the amendment period (generally 2 years from that notice of assessment). This year's claim already starts from the lower opening value, as the law requires.");
      else if(x.status==="unknown") push("teal","aunk_"+a.id+"_"+x.fy,"\""+esc(a.label)+"\": check whether FY"+x.fy+"'s "+money(x.amount)+" was claimed",
        "Look at your FY"+x.fy+" return or notice of assessment. If it wasn't claimed, mark it 'Not claimed: amend' in the Asset Register and amend that year.");
    });
    const y=assetYear(a,S.meta.activeFY||FY.label);
    if(y.decline>0 && !a.docId && num(a.cost)>300) push("amber","anodoc_"+a.id,"\""+esc(a.label)+"\": no receipt linked","Depreciation claims need the purchase receipt kept for 5 years after the LAST year you claim, which for a 20-year desk is a long time. Upload it to the Evidence Vault and link it in the Asset Register.");
  });
  // Scope disclaimer: things this tool does NOT handle
  push("teal","scope","Out of scope: some situations need a registered tax agent",
    "This tool does not calculate: foreign income or foreign tax offsets, trust or partnership distributions, cryptocurrency or share CGT (only the rental property), small business CGT concessions, spouse super contribution offset, or SAPTO. If any apply to you, the estimate will be incomplete, see a registered tax agent.");
  return out;
}

function classifyLocal(txns){
  const flags=[];
  txns.forEach((t,i)=>{
    const desc=String(t.desc||t.description||t.merchant||t.name||"");
    const amt=Math.abs(num(t.amount||t.value||t.amt));
    if(!desc||amt<2) return;
    for(const r of FV_RULES){ if(r.re.test(desc)){ flags.push({i, date:t.date||"", desc, amount:amt, cat:r.cat, why:r.why, status:"new", conf:"rule"}); break; } }
  });
  return flags;
}

 ["dash","DB","Dashboard"],["interview","IQ","Claim Finder"],["income","IN","Income"],
 ["biz","BZ","Business ABN"],["prop","PR","Property & CGT"],["ded","D#","Deductions"],["assets","AR","Asset Register"],

function bind(root){
  root.querySelectorAll("[data-path]").forEach(el=>{
    const path=el.dataset.path.split(".");
    let ref=S; for(let i=0;i<path.length-1;i++) ref=ref[path[i]];
    const key=path[path.length-1];
    if(el.type==="checkbox") el.checked=!!ref[key]; else el.value=ref[key]??"";
    el.onchange=()=>{ ref[key]= el.type==="checkbox"?el.checked : (el.type==="number"?num(el.value):el.value); save(); if(el.dataset.re!=="0") render(); };
  });
}

// Getting-started checklist state: each step has done/label/tab
function checklistState(){
  const anyIncome=activePeople().some(pk=>num(S.people[pk].salary.gross)>0)||num(S.business.uber.income)>0||num(S.business.meridian.income)>0;
  const unanswered=[];
  activePeople().forEach(pk=>QBANK.filter(q=>q.who.includes(pk)).forEach(q=>{ if(!((pk+"_"+q.id) in S.interview.answers)) unanswered.push(1); }));
  const totalQ=activePeople().length*QBANK.length;
  const answeredQ=totalQ-unanswered.length;
  const anyDed=activePeople().some(pk=>S.people[pk].deductions.length>0);
  const reds=runAudit().filter(f=>f.sev==="red").length;
  return [
    { done:anyIncome, label:"Enter your income", tab:"income" },
    { done:answeredQ>0, label:"Work through the Claim Finder"+(unanswered.length?" ("+unanswered.length+" of "+totalQ+" questions left)":" (all answered)"), tab:"interview", partial:answeredQ>0&&unanswered.length>0 },
    { done:anyDed, label:"Review your deductions ledger", tab:"ded" },
    { done:S.docs.length>0, label:"Upload key documents to the Evidence Vault", tab:"vault" },
    { done:reds===0, label:reds?("Clear "+reds+" red flag(s) in Audit Shield"):"Audit Shield clear of red flags", tab:"audit" }
  ];
}
function nextBestAction(){
  const cs=checklistState();
  // highest-priority incomplete step; red flags jump the queue if income is in
  const reds=runAudit().filter(f=>f.sev==="red").length;
  let target=cs.find(s=>!s.done);
  if(!target){ return '<div class="alert teal" style="margin-bottom:12px"><span class="sev">READY</span> <b>All the essentials are done.</b> Cross-check the numbers against myTax\u2019s on-screen estimate before you lodge, then export a full backup. <button class="btn sm ghost nba" data-t="lodge" style="float:right">myTax Handoff &rarr;</button></div>'; }
  return '<div class="alert" style="margin-bottom:12px;border-color:var(--gold)"><span class="sev">NEXT</span> <b>'+esc(target.label)+'</b> <button class="btn sm nba" data-t="'+target.tab+'" style="float:right">Go &rarr;</button><br><span class="hint">Your best next step. Work top-down through the checklist below.</span></div>';
}
function gettingStarted(){
  const cs=checklistState(); const done=cs.filter(s=>s.done).length;
  return '<div class="card" style="margin-top:14px"><h3>Getting started <span class="tag">'+done+' of '+cs.length+'</span></h3>'+
    cs.map(s=>'<div class="row nba" data-t="'+s.tab+'" style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--line2);align-items:center">'+
      '<span style="font-size:16px;width:22px">'+(s.done?'\u2705':(s.partial?'\uD83D\uDD38':'\u2b1c'))+'</span>'+
      '<span style="flex:1'+(s.done?';opacity:.6':'')+'">'+esc(s.label)+'</span>'+
      '<span class="hint">'+tabLabel(s.tab)+' &rarr;</span></div>').join("")+
    '</div>';
}
function strategyList(){  const items=[]; const m=mlsCalc();

  const ansD=S.interview.answers; const unans=QBANK.filter(q=>q.who.includes("deepu")&&!( "deepu_"+q.id in ansD)).length+QBANK.filter(q=>q.who.includes("bhavana")&&!( "bhavana_"+q.id in ansD)).length;
  if(unans) items.push(["Claim Finder", unans+" questions unanswered. Each one maps to a legitimate deduction with its substantiation rule attached."]);

    const actual=bills.reduce((a,b)=>a+(counted(b,fixed)?billClaim(b,pk):0),0);
    const actualEst=bills.reduce((a,b)=>a+(b.kind==="depr"?0:num(b.annual)*num(pk==="deepu"?b.pctDeepu:b.pctBhavana)/100),0);
    let rec="";
    if(fixed&&Math.round(actualEst)>fixedEst&&bills.length) rec='<div class="hint" style="color:var(--gold)">Actual cost shares would give about '+money(actualEst)+' vs '+money(fixedEst)+' on the fixed rate. To switch, set the WFH hours answer above to 0 (you will need bills plus a 4-week representative usage diary as records).</div>';
    if(!fixed&&hrs>0) rec='<div class="hint">Comparison: fixed rate on your '+hrs+'h would be '+money(fixedEst)+'. Actual shares currently total '+money(actual)+'. Keep whichever is higher, per person. Asset decline shares count under BOTH methods.</div>';

      ? '<span class="pill">70c fixed rate</span> <span class="hint">bill shares blocked (in the rate); asset decline shares still claiming '+money(actual)+'</span>'

  '<div class="note" style="margin-bottom:10px">One bill or asset, two claimants: enter it once and each person\u2019s OWN work-use percentage. Running-cost bills (internet, energy, phone) are claimed under the actual cost method, so anyone on the 70c fixed rate is excluded from those, the rate already includes them. Depreciating ASSETS are different: the fixed rate does NOT cover decline in value, so both of you claim your asset shares no matter which method you use. Percentages are independent but together must stay believable.</div>'+
  status("deepu")+status("bhavana")+
  '<table class="fvlist" style="margin-top:10px"><tr><th>Bill / asset</th><th>Annual $ '+
  '<span class="hint">(bill total, or annual decline for assets)</span></th><th>'+esc(pname("deepu"))+' work %</th><th>'+esc(pname("bhavana"))+' work %</th><th>'+esc(pname("deepu"))+' claims</th><th>'+esc(pname("bhavana"))+' claims</th><th>Evidence</th><th></th></tr>'+
  bills.map((b,i)=>'<tr><td><input value="'+esc(b.label)+'" data-sbl="'+i+'" style="width:100%">'+(b.fvNote?'<div class="hint">From your bank feed: '+(b.fvNote.match(/;/g)||[]).length+' charge(s) this year</div>':'')+(b.kind==="depr"?'<span class="pill gold" style="font-size:10px">asset: decline in value</span>'+(b.meta?'<div class="hint">'+esc(b.meta)+'</div>':''):'')+'</td>'+

function bindSharedBills(m){
  const upd=()=>{ syncSharedBills(); save(); render(); };
  m.querySelectorAll(".sbadd").forEach(b=>b.onclick=()=>{ S.sharedBills.push({id:uid(),label:b.dataset.l||"Bill",annual:0,pctDeepu:0,pctBhavana:0}); save(); render(); });
  m.querySelectorAll(".sbaddasset").forEach(b=>b.onclick=()=>{ S.sharedBills.push({id:uid(),label:"Shared asset",kind:"depr",annual:0,pctDeepu:0,pctBhavana:0}); save(); render(); });
  m.querySelectorAll(".sbdel").forEach(b=>b.onclick=()=>{ S.sharedBills.splice(Number(b.dataset.i),1); upd(); });
  m.querySelectorAll("[data-sbl]").forEach(el=>el.onchange=()=>{ S.sharedBills[Number(el.dataset.sbl)].label=el.value; upd(); });
  m.querySelectorAll("[data-sba]").forEach(el=>el.onchange=()=>{ S.sharedBills[Number(el.dataset.sba)].annual=num(el.value); upd(); });
  m.querySelectorAll("[data-sbd]").forEach(el=>el.onchange=()=>{ S.sharedBills[Number(el.dataset.sbd)].pctDeepu=Math.max(0,Math.min(100,num(el.value))); upd(); });
  m.querySelectorAll("[data-sbb]").forEach(el=>el.onchange=()=>{ S.sharedBills[Number(el.dataset.sbb)].pctBhavana=Math.max(0,Math.min(100,num(el.value))); upd(); });
  m.querySelectorAll(".sblink").forEach(btn=>btn.onclick=()=>{
    const b=S.sharedBills[Number(btn.dataset.i)];
    if(!S.docs.length){ toast("Vault is empty: upload the bills first",true); return; }
    const dlg=$("#modal"); const linked=new Set(b.docs||[]);
    const rowHtml=doc=>'<label class="linkrow" data-name="'+esc((doc.name+" "+(doc.summary||"")).toLowerCase())+'" style="display:flex;gap:8px;align-items:flex-start;margin:5px 0;color:var(--ink)"><input type="checkbox" value="'+doc.id+'" '+(linked.has(doc.id)?"checked":"")+' style="width:auto;margin-top:3px"><span>'+esc(doc.name)+(doc.summary?' <span class="hint">'+esc(doc.summary)+'</span>':'')+'</span></label>';
    dlg.innerHTML='<h3 class="serif">Link evidence to shared bill: '+esc(b.label)+'</h3>'+
      '<div class="hint" style="margin-bottom:8px">These documents will substantiate BOTH '+esc(pname("deepu"))+'\u2019s and '+esc(pname("bhavana"))+'\u2019s share. For a monthly bill, filter and link all 12.</div>'+
      '<div class="row" style="margin-bottom:8px"><input id="lfilter" placeholder="Filter, e.g. internet, telstra" style="flex:1"><button class="btn sm ghost" id="lall">Select all shown</button><button class="btn sm ghost" id="lnone">Clear shown</button></div>'+
      '<div id="lcount" class="hint" style="margin-bottom:6px"></div>'+
      '<div id="llist" style="max-height:340px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:8px">'+S.docs.map(rowHtml).join("")+'</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn" id="mok">Save links</button><button class="btn dim" id="mx">Close</button></div>';
    dlg.showModal();
    const rows=()=>Array.from(dlg.querySelectorAll(".linkrow"));
    const shownRows=()=>rows().filter(r=>r.style.display!=="none");
    const updateCount=()=>{ const c=dlg.querySelectorAll("#llist input:checked").length; dlg.querySelector("#lcount").textContent=c+" linked, "+shownRows().length+" shown of "+S.docs.length; };
    const applyFilter=()=>{ const q=dlg.querySelector("#lfilter").value.trim().toLowerCase(); rows().forEach(r=>{ r.style.display=(!q||r.dataset.name.includes(q))?"flex":"none"; }); updateCount(); };
    dlg.querySelector("#lfilter").oninput=applyFilter;
    dlg.querySelector("#lall").onclick=()=>{ shownRows().forEach(r=>r.querySelector("input").checked=true); updateCount(); };
    dlg.querySelector("#lnone").onclick=()=>{ shownRows().forEach(r=>r.querySelector("input").checked=false); updateCount(); };
    dlg.querySelectorAll("#llist input").forEach(c=>c.onchange=updateCount);
    updateCount();
    dlg.querySelector("#mok").onclick=()=>{
      b.docs=Array.from(dlg.querySelectorAll("#llist input:checked")).map(c=>c.value);
      // flow the docs onto both people's deduction lines for this bill
      ["deepu","bhavana"].forEach(pk=>{ const line=S.people[pk].deductions.find(x=>x.src==="sb_"+b.id); if(line) line.evidence=b.docs.slice(); });
      save(); dlg.close(); render(); toast(b.docs.length+" document(s) linked to both claimants");
    };
    dlg.querySelector("#mx").onclick=()=>dlg.close();
  });
}

/* ===== DEDUPLICATION INTELLIGENCE =====
   Each interview question overlaps a category of spending. If the user has already
   claimed matching items from documents (Evidence Vault) or FinVault, the interview
   should SHOW those and warn, so the same expense is not entered twice. */
const QMATCH={
  memb:    { rx:/subscri|member|union|licen[cs]e|journal|software|office ?365|microsoft|adobe|canva|creately|notion|github|professional/i, cats:["D5"], label:"subscriptions/memberships" },
  selfed:  { rx:/course|training|cert|certif|conference|seminar|tuition|textbook|udemy|coursera|itil|pmp|prince2|aws|azure/i, cats:["D4"], label:"self-education" },
  travel:  { rx:/parking|toll|taxi|uber(?! ?driver)|flight|airfare|accommodation|hotel|cab|rideshare fare/i, cats:["D2"], label:"work travel" },
  car:     { rx:/\bkm\b|cents per km|mileage|fuel|petrol|logbook/i, cats:["D1"], label:"car expenses" },
  incprot: { rx:/income protection|salary continuance|ip premium/i, cats:["D15"], label:"income protection" },
  donate:  { rx:/donat|charity|dgr|gift|appeal|fund|cathedral|church/i, cats:["D9"], label:"donations" },
  agentfee:{ rx:/tax agent|accountant|etax|itp|h&r|tax return fee|managing tax/i, cats:["D10"], label:"tax agent fee" },
  equip300:{ rx:/keyboard|mouse|headset|lamp|cable|monitor stand|dock|webcam|stationery/i, cats:["D5"], label:"equipment under $300" },
  equipBig:{ rx:/laptop|monitor|desk|chair|printer|phone handset|ipad|tablet|decline in value|depreciat/i, cats:["D5"], label:"assets over $300" }
};
// deductions for a person that came from a DOCUMENT or FINVAULT (not from this interview question)
function evidenceClaimsFor(pk, qid){
  const spec=QMATCH[qid]; if(!spec) return {items:[], total:0};
  const items=(S.people[pk].deductions||[]).filter(d=>{
    if(d.src===qid) return false;                 // the line this question itself made
    const fromEvidence = d.docId || (d.evidence&&d.evidence.length) || /finvault|from finvault|recurring/i.test(d.notes||"");
    if(!fromEvidence) return false;
    const catOk = spec.cats.includes(d.cat);
    const textOk = spec.rx.test((d.label||"")+" "+(d.notes||""));
    return catOk && textOk;
  }).map(d=>({label:d.label, amount:num(d.amount)}));
  return { items, total:Math.round(items.reduce((a,b)=>a+b.amount,0)*100)/100 };
}

// Super contribution tax-impact: shows the effect of a planned personal deductible contribution.
// Calculation only, not advice, and it respects the concessional cap warning already in the engine.
function superImpactCard(){
  return '<div class="card" style="margin-top:12px"><h3>Personal super contribution: tax impact <span class="tag">what-if</span></h3>'+
  '<div class="hint" style="margin-bottom:8px">See what a personal (after-tax) super contribution you then claim as a deduction would do to your tax. This is a calculator, not advice: whether to contribute, and your available cap, are things to confirm in myGov or with a licensed adviser. Contributions inside super are taxed at 15%.</div>'+
  '<div class="two"><div><label>Who</label><select id="siWho">'+peopleOptions()+'</select></div>'+
  '<div><label>Planned personal deductible contribution</label><input type="number" step="any" id="siAmt" placeholder="e.g. 10000"></div></div>'+
  '<div id="siOut" class="hint" style="margin-top:8px"></div></div>';
}
function bindSuperImpact(m){
  const who=m.querySelector("#siWho"), amt=m.querySelector("#siAmt"), out=m.querySelector("#siOut");
  if(!who||!amt||!out) return;
  const calc=()=>{
    const pk=who.value, add=num(amt.value);
    if(add<=0){ out.textContent=""; return; }
    const before=finalNumbers(pk);
    // simulate: add a D12 deduction, recompute, then revert
    const P=S.people[pk]; const tmp={id:"__sim",cat:"D12",label:"simulated personal super",amount:add};
    P.deductions.push(tmp);
    const after=finalNumbers(pk);
    P.deductions.pop();
    const taxDrop=(before.liability)-(after.liability);
    const contribTax=Math.round(add*0.15);
    const net=Math.round(taxDrop-contribTax);
    const capMsg = after.overCap>0 ? ' <b style="color:var(--red)">Warning: this would put concessional contributions about '+money(after.overCap)+' over the $'+FY.concessionalCap.toLocaleString()+' cap</b> (unless you have carry-forward room, check myGov).' : '';
    out.innerHTML='Contributing '+money(add)+': your income-tax liability falls by about <b>'+money(taxDrop)+'</b>. Inside super it is taxed 15% (~'+money(contribTax)+'), so the rough net benefit is <b>'+money(net)+'</b>.'+capMsg+' This is an estimate, confirm your cap and eligibility before contributing.';
  };
  who.onchange=calc; amt.oninput=calc;
}

/* ===== WFH METHOD COMPARISON (per person) =====
   Fixed rate: hours x 70c (covers energy, internet, phone, stationery).
   Actual cost: work-use share of energy + internet + phone bills + decline in value of office assets.
   Recommends the larger method, but only endorses actual cost if its bills are evidenced. */
// Occupation-based deduction PROMPTS (memory jog only, never pre-fills a claim).
// Framed as "commonly claimed, check if it applies to you", each still needs the normal eligibility test.
const OCC_HINTS=[
  { re:/nurse|midwif|health|paramedic|carer/i, label:"nursing / health",
    items:["Professional registration (AHPRA)","Union or professional association fees","Professional indemnity insurance (if not employer-paid)","Uniform laundry at ATO rates","Nursing equipment over $300 (depreciated)","Compulsory CPD courses and conferences","First-aid certificate renewal"] },
  { re:/develop|software|engineer|IT|program|data|analyst|tech/i, label:"IT / engineering",
    items:["Home office running costs and equipment (monitor, desk, chair)","Work-use share of internet and phone","Computers over $300 (depreciated 2-4 years)","Work software subscriptions","Professional memberships (ACS, Engineers Australia)","Self-education and certifications for your current role","Technical books and journals"] },
  { re:/teacher|educat|lectur|tutor/i, label:"education",
    items:["Teaching resources and classroom supplies","Union fees","Excursion costs not reimbursed","Home office for marking and planning","Self-education relevant to current teaching","Professional memberships"] },
  { re:/account|finance|bookkeep|audit|tax/i, label:"finance / accounting",
    items:["CPA / CA ANZ membership","Professional indemnity insurance","Technical journals and subscriptions","Self-education (current role)","Home office","Work-use phone and internet"] },
  { re:/construct|trade|electric|plumb|carpent|builder|mechanic/i, label:"trades",
    items:["Tools and equipment (over $300 depreciated)","Protective clothing and safety gear","Sunscreen and sun protection (outdoor work)","Union fees","Vehicle for carrying bulky tools","Licence and ticket renewals"] },
  { re:/sales|account manager|marketing|business develop/i, label:"sales / marketing",
    items:["Work-related car travel (log it)","Client entertainment (limited, check rules)","Phone and internet work share","Professional memberships","Self-education","Home office"] },
  { re:/manager|director|executive|consult|advisor|program/i, label:"management / consulting",
    items:["Professional memberships and subscriptions","Self-education and conferences for your current role","Home office running costs","Work-use phone and internet","Work-related travel (not commuting)","Technical publications"] }
];
function occHintCard(){
  const rows=activePeople().map(pk=>{
    const occ=(S.people[pk].occ||"");
    const match=OCC_HINTS.find(h=>h.re.test(occ));
    if(!occ) return '<div style="margin-bottom:8px"><b>'+esc(pname(pk))+'</b> <span class="hint">add an occupation in Settings to see commonly-claimed deductions</span></div>';
    if(!match) return '<div style="margin-bottom:8px"><b>'+esc(pname(pk))+'</b> <span class="hint">('+esc(occ)+') no specific list, the general work-related categories in the questions above cover you</span></div>';
    return '<div style="margin-bottom:10px"><b>'+esc(pname(pk))+'</b> <span class="hint">('+esc(occ)+', '+match.label+')</span><ul style="margin:6px 0 0 18px;font-size:13px;color:var(--ink-dim)">'+match.items.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
  }).join("");
  return '<div class="card" style="margin-top:14px"><h3>Commonly claimed in your occupation <span class="tag">check if it applies</span></h3>'+
    '<div class="hint" style="margin-bottom:8px">A memory jog, not a claim list. These are deductions people in similar roles often have. Only claim what you actually spent, for work, with a record, and not reimbursed. Each still goes through the normal questions and evidence rules above.</div>'+
    rows+'</div>';
}

function wfhCompareCard(){  const rows=activePeople().map(pk=>{
    const w=wfhCompare(pk);
    if(!w.hasData) return '<div style="margin-bottom:10px"><b>'+esc(pname(pk))+'</b> <span class="hint">enter WFH hours and shared bills to compare methods</span></div>';
    const rec = w.better==="actual"
      ? (w.actualEvidenced
          ? '<span class="pill ok">Actual cost is '+money(w.diff)+' better and your bills are attached, recommended</span>'
          : '<span class="pill bad">Actual cost looks '+money(w.diff)+' better BUT the bills are not all in the Evidence Vault, so it is unsubstantiated. Attach them or use the fixed rate.</span>')
      : '<span class="pill ok">Fixed rate is '+(w.diff>0?money(w.diff)+' better and':'')+' simpler, recommended</span>';
    return '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line2)">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline"><b>'+esc(pname(pk))+'</b>'+rec+'</div>'+
      '<div class="mini" style="margin-top:6px">'+
        '<div><span>Fixed rate</span><br><b class="money">'+money(w.fixed)+'</b><br><span class="hint">'+w.hours+'h x 70c</span></div>'+
        '<div><span>Actual cost</span><br><b class="money">'+money(w.actual)+'</b><br><span class="hint">energy '+money(w.energy)+' + net/phone '+money(w.internetPhone)+'</span></div>'+
        '<div><span>Asset decline (either method)</span><br><b class="money">'+money(w.assets)+'</b><br><span class="hint">added on top whichever you pick</span></div>'+
      '</div></div>';
  }).join("");
  return '<div class="card" style="margin-top:14px"><h3>Working-from-home: which method wins? <span class="tag">per person</span></h3>'+
    '<div class="hint" style="margin-bottom:10px">You pick ONE method per person. Fixed rate (70c/hour) is simple and bundles energy, internet and phone. Actual cost claims the real work-use share of those bills plus equipment decline, and can be larger if your bills are high, but only if you keep the bills and can defend the percentages. The tool recommends the bigger method, but will not endorse actual cost unless the bills are attached in the Evidence Vault.</div>'+
    rows+
    '<div class="hint" style="margin-top:4px">Remember: whichever method you choose, you cannot also claim the same running costs the other way. If you take the fixed rate, do not separately claim internet/phone/energy shares.</div></div>';
}

function wfhCompare(pk){
  const P=S.people[pk];
  const hours=num(S.interview.answers[pk+"_wfh"]);
  const fixed=Math.round(hours*FY.wfhFixedRate*100)/100;
  let energy=0, internetPhone=0, assets=0, evidencedBillDocs=0, billCount=0;
  (S.sharedBills||[]).forEach(b=>{
    const share=billClaim(b,pk); if(share<=0) return;
    const lbl=(b.label||"").toLowerCase();
    if(b.kind==="depr"){ assets+=share; return; }
    if(/electric|energy|gas|power/.test(lbl)){ energy+=share; billCount++; if((b.docs||[]).length) evidencedBillDocs++; }
    else if(/internet|nbn|broadband|phone|mobile|data/.test(lbl)){ internetPhone+=share; billCount++; if((b.docs||[]).length) evidencedBillDocs++; }
  });
  P.deductions.forEach(d=>{ if(/decline in value|depreciat/i.test((d.label||"")+" "+(d.notes||""))) assets+=num(d.amount); });
  // Asset decline is claimable under BOTH methods, so it must not tip the comparison.
  const actual=Math.round((energy+internetPhone)*100)/100;
  const actualEvidenced = billCount>0 ? (evidencedBillDocs>=billCount) : false;
  const better = actual>fixed ? "actual" : "fixed";
  const diff=Math.abs(actual-fixed);
  return {hours, fixed, actual, energy, internetPhone, assets, better, diff, actualEvidenced, hasData:(hours>0||actual>0)};
}

/* ---- DEDUCTIONS ---- */
// Evidence traffic light: green = attached, amber = recommended (over $300, none yet), red = required and missing
function evStatus(d){
  const n=(d.evidence||[]).length;
  if(n>0) return '<span class="pill ok" title="Evidence attached">\uD83D\uDFE2 '+n+'</span>';
  if(num(d.amount)>300) return '<span class="pill bad" title="Evidence required for claims over $300">\uD83D\uDD34 needed</span>';
  return '<span class="pill" title="Evidence recommended">\uD83D\uDFE1 optional</span>';
}

/* ---- CLAIM WIZARD: turns a vault document into the right claim, in the right place ---- */
/* Remove everything a document previously created, so re-claiming edits instead of duplicating. */
function clearDocClaims(docId){
  ["deepu","bhavana"].forEach(pk=>{
    S.people[pk].deductions=S.people[pk].deductions.filter(d=>d.docId!==docId);
  });
  ["uber","meridian"].forEach(b=>{
    S.business[b].expenses=S.business[b].expenses.filter(e=>e.docId!==docId);
  });
  // rental: unwind the exact amount that was added
  if(S.property.rentalDocClaims&&S.property.rentalDocClaims[docId]){
    const r=S.property.rentalDocClaims[docId];
    S.property.rental[r.field]=Math.max(0, num(S.property.rental[r.field])-num(r.amount));
    delete S.property.rentalDocClaims[docId];
  }
  S.assets=(S.assets||[]).filter(a=>!(a.docId===docId&&a.fromDoc)); syncAssetLines();
  // shared bills: drop this doc; if a bill has no docs left and was created from a doc, remove it
  (S.sharedBills||[]).forEach(b=>{ if(b.docs) b.docs=b.docs.filter(id=>id!==docId); });
  S.sharedBills=(S.sharedBills||[]).filter(b=>!(b.docs&&b.docs.length===0&&b._fromDoc));
  syncSharedBills();
}

      '<div class="grid g2" style="margin-top:4px">'+

      '<div><label class="lbl">'+pname("bhavana")+'\u2019s share of total use %</label><input id="cw_useB" type="number" step="any" value="50"></div></div>'+
      '<div style="margin-top:10px;font-size:12px;color:var(--gold);font-weight:600">Step 2 \u2014 of each person\u2019s own use, how much is work</div>'+

    } else if(target==="uber"||target==="meridian"){

      (target==="uber"&&S.business.uber.method==="cpk"&&/fuel|petrol|bp |shell|7-eleven|ampol|caltex|service|tyre|rego|insurance/i.test((ex.vendor||"")+" "+doc.name)?'<div class="note" style="margin-top:8px;border-color:var(--red)">You are on cents per km for the car: fuel, rego, insurance, servicing and tyres are INSIDE the 88c rate and cannot be claimed again. Only non-car costs (phone %, Uber fees, water/mints, cleaning) go here. Switch to the logbook method in the Business tab if you want actual car costs.</div>':'');
    } else if(target==="rental"){
      body='<div class="grid g2">'+
      '<div><label class="lbl">Rental expense type</label><select id="cw_rf">'+rentFields.map(f=>'<option value="'+f[0]+'">'+f[1]+'</option>').join("")+'</select></div>'+
      '<div><label class="lbl">Amount $ (whole property, split follows title automatically)</label><input id="cw_amt" type="number" step="any" value="'+(total||"")+'"></div></div>'+
      '<div class="hint" style="margin-top:6px">Adds to the Item 21 schedule. Repairs restoring function are deductible now; improvements are capital works at 2.5% or cost base. If unsure, pick capital works, the safer default for anything that betters the asset.</div>';
    }
    dlg.innerHTML='<h3 class="serif">Claim this document</h3>'+
