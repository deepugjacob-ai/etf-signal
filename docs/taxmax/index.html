  function computeBothSplit(g){
    const isDepr=g("cw_depr")&&g("cw_depr").checked;
    let base;
    if(isDepr){
      const cost=num(g("cw_cost").value)||num(g("cw_amt").value);
      const life=Math.max(1,num(g("cw_life").value)||4);
      const tmp={cost, life, purchaseDate:g("cw_pdate").value||FY.start, method:"pc"};
      base=Math.round(assetYear(tmp, S.meta.activeFY||FY.label).decline*100)/100; // this FY's decline (preview; register picks the best method)
    } else {
      base=num(g("cw_amt").value);
    }
    let useD=Math.max(0,num(g("cw_useD").value)), useB=Math.max(0,num(g("cw_useB").value));
    // normalise usage split to 100% (so 70 & 80 -> 46.7 & 53.3, never 150)
    const uSum=useD+useB;
    const nD=uSum>0?useD/uSum:0.5, nB=uSum>0?useB/uSum:0.5;
    const wD=Math.max(0,Math.min(100,num(g("cw_pd").value)))/100;
    const wB=Math.max(0,Math.min(100,num(g("cw_pb").value)))/100;
    const fixedD=onFixedRate("deepu")&&!isDepr, fixedB=onFixedRate("bhavana")&&!isDepr;
    const claimD=fixedD?0:Math.round(base*nD*wD*100)/100;
    const claimB=fixedB?0:Math.round(base*nB*wB*100)/100;
    return {isDepr, base, nD, nB, wD, wB, fixedD, fixedB, claimD, claimB, uSum, rawUseD:useD, rawUseB:useB};
  }
  function updateSplitPreview(){
    const g=id=>dlg.querySelector("#"+id); const box=dlg.querySelector("#cw_splitPrev"); if(!box) return;
    const s=computeBothSplit(g);
    const pctTot=Math.round((s.nD*s.wD+s.nB*s.wB)*1000)/10;
    let warn="";
    if(s.uSum!==100&&s.uSum>0) warn='<div class="hint" style="color:var(--gold)">Usage split entered as '+s.rawUseD+' + '+s.rawUseB+' = '+s.uSum+'%. Normalised automatically to '+Math.round(s.nD*1000)/10+'% / '+Math.round(s.nB*1000)/10+'% so it totals 100%.</div>';
    box.innerHTML='<b>'+(s.isDepr?"Decline in value this year: ":"Claimable split of ")+money(s.base)+'</b><br>'+
      pname('deepu')+': '+(s.fixedD?'<span class="hint">in fixed rate, $0</span>':(Math.round(s.nD*1000)/10+'% use x '+Math.round(s.wD*100)+'% work = <b class="money pos">'+money(s.claimD)+'</b>'))+'<br>'+
      pname('bhavana')+': '+(s.fixedB?'<span class="hint">in fixed rate, $0</span>':(Math.round(s.nB*1000)/10+'% use x '+Math.round(s.wB*100)+'% work = <b class="money pos">'+money(s.claimB)+'</b>'))+'<br>'+
      '<span class="hint">Combined '+money(s.claimD+s.claimB)+' of '+money(s.base)+' ('+pctTot+'% of the item), never above 100%.</span>'+warn;
  }
  const apply=()=>{
    const g=id=>dlg.querySelector("#"+id);
    const label=g("cw_label")?g("cw_label").value:doc.name;
    let amt=num(g("cw_amt")&&g("cw_amt").value);
    let appliedMsg="";
    // If this document was claimed before, undo its previous lines so re-claiming EDITS rather than duplicates.
    clearDocClaims(doc.id);
    if(target==="deepu"||target==="bhavana"){
      const pct=Math.max(0,Math.min(100,num(g("cw_pct").value)||100));
      if(g("cw_ann")&&g("cw_ann").checked) amt=amt*12/perMonths;
      let claim=Math.round(amt*pct/100*100)/100;
      let notes=pct+"% work use";
      if(g("cw_depr")&&g("cw_depr").checked){
        // Goes into the cross-year asset register so later years are claimed automatically
        const asset={id:uid(), label, owner:target, cost:amt, purchaseDate:g("cw_pdate").value||(ex.date||FY.start), life:Math.max(1,num(g("cw_life").value)||guessLife(label)||3),
          workPct:pct, docId:doc.id, fromDoc:true, claimedYears:{}, cat:(g("cw_cat")&&g("cw_cat").value)||"D5"};
        asset.method=recommendMethod(asset);
        S.assets=S.assets||[]; S.assets.push(asset); syncAssetLines();
        const y=assetYear(asset,S.meta.activeFY||FY.label);
        appliedMsg=S.people[target].name+" asset register: "+label+" ("+METHOD_LABEL[asset.method]+"), FY"+(S.meta.activeFY||FY.label)+" "+money(y.decline*pct/100);
      } else {
      S.people[target].deductions.push({id:uid(),src:null,docId:doc.id,cat:(g("cw_cat")&&g("cw_cat").value)||"D5",label,amount:claim,evidence:[doc.id],notes});
      appliedMsg=S.people[target].name+" "+((g("cw_cat")&&g("cw_cat").value)||"D5")+" "+money(claim);
      }
    } else if(target==="both"){
      const s=computeBothSplit(g);
      let kind, meta;
      if(s.isDepr){
        const cost=num(g("cw_cost").value)||amt;
        const life=Math.max(1,num(g("cw_life").value)||4);
        amt=s.base; kind="depr"; meta="decline in value: "+money(cost)+" / "+life+"y";
      } else {
        amt=s.base;
      }
      // effective percentage of the whole item for each person = normalised usage share x their work %
      // (this can never sum above 100 because usage shares are normalised to 100)
      const effD=Math.round(s.nD*s.wD*10000)/100;
      const effB=Math.round(s.nB*s.wB*10000)/100;
      if(s.isDepr){
        const asset={id:uid(), label, owner:"both", cost:num(g("cw_cost").value)||num(g("cw_amt").value), purchaseDate:g("cw_pdate").value||(ex.date||FY.start),
          life:Math.max(1,num(g("cw_life").value)||guessLife(label)||4), pctDeepu:effD, pctBhavana:effB, docId:doc.id, fromDoc:true, claimedYears:{}, cat:"D5"};
        asset.method=recommendMethod(asset);
        S.assets=S.assets||[]; S.assets.push(asset); syncAssetLines();
        const y=assetYear(asset,S.meta.activeFY||FY.label);
        doc.claimed={target,msg:"asset register (shared): "+label+", FY"+(S.meta.activeFY||FY.label)+" decline "+money(y.decline)+" split "+effD+"% / "+effB+"%",when:new Date().toISOString().slice(0,10)};
        save(); dlg.close(); render(); toast("Added to the asset register: future years are automatic"); return;
      }
      const key=label.trim().toLowerCase();
      let bill=S.sharedBills.find(x=>x.label.trim().toLowerCase()===key);
      if(!bill){ bill={id:uid(),label,annual:amt,pctDeepu:effD,pctBhavana:effB,docs:[],_fromDoc:true}; S.sharedBills.push(bill); }
      else { bill.annual=amt; bill.pctDeepu=effD; bill.pctBhavana=effB; }
      bill.kind=kind; bill.meta=meta;
      bill.usage={deepu:Math.round(s.nD*1000)/10, bhavana:Math.round(s.nB*1000)/10, workD:Math.round(s.wD*100), workB:Math.round(s.wB*100)};
      bill.docs=(bill.docs||[]); if(!bill.docs.includes(doc.id)) bill.docs.push(doc.id);
      syncSharedBills();
      ["deepu","bhavana"].forEach(pk=>{ const line=S.people[pk].deductions.find(x=>x.src==="sb_"+bill.id); if(line&&!(line.evidence||[]).includes(doc.id)) (line.evidence=line.evidence||[]).push(doc.id); });
      const cell=pk=>(onFixedRate(pk)&&kind!=="depr")?"in fixed rate":money(billClaim(bill,pk));
      appliedMsg="shared "+(kind==="depr"?"asset":"bill")+" \""+label+"\": Deepu "+cell("deepu")+", Bhavana "+cell("bhavana");
    } else if(target==="uber"||target==="meridian"){
      const pct=Math.max(0,Math.min(100,num(g("cw_pct").value)||100));
      if(g("cw_bizasset")&&g("cw_bizasset").checked){
        const asset={id:uid(), label, owner:target, cost:amt, purchaseDate:ex.date||FY.start, life:guessLife(label)||5, workPct:pct, docId:doc.id, fromDoc:true, claimedYears:{}};
        asset.method=recommendMethod(asset);
        S.assets=S.assets||[]; S.assets.push(asset); syncAssetLines();
        appliedMsg=bizName(target)+" asset: "+label+" ("+METHOD_LABEL[asset.method]+")";
        doc.claimed={target,msg:appliedMsg,when:new Date().toISOString().slice(0,10)};
        save(); dlg.close(); render(); toast("Added "+appliedMsg+". Check the date and life in the Asset Register."); return;
      }
      const claim=Math.round(amt*pct/100*100)/100;
      S.business[target].expenses.push({id:uid(),docId:doc.id,label:label+(pct<100?" ("+pct+"% business)":""),amount:claim,evidence:[doc.id]});
      appliedMsg=bizName(target)+" expense "+money(claim);
    } else if(target==="rental"){
      const f=g("cw_rf").value;
      S.property.rental[f]=num(S.property.rental[f])+amt;
      S.property.rentalDocClaims=S.property.rentalDocClaims||{};
      S.property.rentalDocClaims[doc.id]={field:f, amount:amt};
      appliedMsg="rental "+f+" +"+money(amt)+" (Item 21)";
    }
    doc.claimed={target,msg:appliedMsg,when:new Date().toISOString().slice(0,10)};
    save(); dlg.close(); render(); toast((doc.claimed?"Updated: ":"Added: ")+appliedMsg);
  };
  draw(); dlg.showModal();
}

/* ---- EVIDENCE VAULT ---- */
VIEWS.vault=(m)=>{
  m.innerHTML=head("Evidence Vault","Drop receipts, invoices, loan statements, Uber summaries, QS depreciation schedules. Stored inside this browser. AI reads PDFs and images and extracts vendor, date, amount and suggested claim category. Keep originals 5 years regardless.")+
  '<div class="note" style="border-color:var(--gold);margin-bottom:12px">Browser storage can be cleared without warning (updates, privacy sweeps, incognito). After adding files, always go to Data &amp; AI and Export full backup: that single file contains your documents and every entry, and restores them anywhere. The Claude preview environment does NOT keep files between days; download the HTML and run it on your ASUS for anything you want to persist.</div>'+
  '<div class="drop" id="drop">Drop files here or <button class="btn sm ghost" id="pick">browse</button> <button class="btn sm ghost" id="camBtn">\uD83D\uDCF7 Take photo</button><input type="file" id="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.csv,.xlsx,.txt" style="display:none"><input type="file" id="camIn" accept="image/*" capture="environment" style="display:none"><div class="hint">PDF and images get AI extraction. On a phone, Take photo opens the camera to snap a receipt.</div></div>'+
  '<div class="row" style="margin-top:8px;align-items:center"><label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="autoRead" '+(S.ai.autoRead!==false?"checked":"")+' style="width:auto"> Auto-read invoices on upload (extract amount, suggest category and who it is for)</label><span class="hint" id="fvst2"></span></div>'+
  '<div id="docs" style="margin-top:14px">'+S.docs.map(doc=>docRow(doc)).join("")+'</div>';
  function docRow(doc){
    const ex=doc.extract;
    const chip = ex ? '<div class="row" style="gap:6px;margin-top:3px"><span class="pill ok">'+money(ex.total||0)+'</span><span class="pill">'+esc((CATS[ex.suggestedCategory]||{label:ex.suggestedCategory||"?"}).label)+'</span>'+(ex.isHouseholdBill?'<span class="pill gold">shared bill</span>':'')+(ex.assetLikely?'<span class="pill gold">asset</span>':'')+(ex.suggestedPerson&&ex.suggestedPerson!=="either"?'<span class="pill">'+esc(pname(ex.suggestedPerson))+'</span>':'')+'</div>' : '';
    return '<div class="doc" id="doc_'+doc.id+'"><span class="dicon">'+esc((doc.name.split(".").pop()||"?").toUpperCase())+'</span>'+
    '<div style="flex:1"><b>'+esc(doc.name)+'</b> <span class="hint">'+(doc.size/1024).toFixed(0)+' KB &middot; '+esc(doc.added||"")+'</span>'+
    chip+
    (ex&&ex.claimableNote?'<div class="hint" style="color:var(--teal)">'+esc(ex.claimableNote)+'</div>':'')+
    (doc.carriedFor?'<div class="hint" style="color:var(--teal,#3BD9A4)">From the FY'+esc(doc.carriedFrom||"")+' vault. '+esc((doc.claimed||{}).msg||"")+'</div>':
     (doc.claimed?'<div class="hint" style="color:var(--gold)">Claimed '+esc(doc.claimed.when)+': '+esc(doc.claimed.msg)+'</div>':''))+
    '</div>'+
    (doc.carriedFor?'<button class="btn sm ghost nba" data-t="assets">Asset Register</button>':
    '<button class="btn sm vclaim" data-id="'+doc.id+'">'+(doc.claimed?"Edit claim":(ex?"Review &amp; claim":"Claim it"))+'</button>'+
    (doc.claimed?'<button class="btn sm dim vunclaim" data-id="'+doc.id+'">Remove claim</button>':''))+
    '<button class="btn sm ghost vread" data-id="'+doc.id+'">'+(doc.extract?"Re-read":"AI read")+'</button>'+
    '<button class="btn sm dim vview" data-id="'+doc.id+'">View</button>'+
    '<button class="btn sm dim vdel" data-id="'+doc.id+'">Delete</button></div>';
  }
  const drop=$("#drop");
  if($("#autoRead")) $("#autoRead").onchange=e=>{ S.ai.autoRead=e.target.checked; save(); toast(e.target.checked?"Auto-read on: invoices will be read as you upload":"Auto-read off: click AI read per file"); };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");handleFiles(e.dataTransfer.files);};
  $("#pick").onclick=()=>$("#file").click();
  if($("#camBtn")) $("#camBtn").onclick=()=>$("#camIn").click();
  if($("#camIn")) $("#camIn").onchange=e=>handleFiles(e.target.files);
  $("#file").onchange=e=>handleFiles(e.target.files);
  async function extractOne(doc){
    const rec=await idbGet(doc.id); if(!rec) return false;
    const isPdf=/pdf$/i.test(doc.name)||doc.type==="application/pdf";
    const isImg=/^image\//.test(doc.type);
    if(!isPdf&&!isImg) return false;
    const b64=await new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(rec.blob);});
    const content=[ isPdf? {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}} : {type:"image",source:{type:"base64",media_type:doc.type,data:b64}},
      {type:"text",text:EXTRACT_PROMPT}];
    const txt=await askAI(content, SYS_TAX);
    const j=parseJSONLoose(txt);
    doc.extract=j; doc.summary=(j.vendor||"")+" "+(j.date||"")+" "+money(j.total||0)+" -> "+(j.suggestedCategory||"")+". "+(j.claimableNote||"");
    return true;
  }
  async function handleFiles(files){
    const added=[];
    for(const f of files){
      if(f.size>8*1024*1024){ toast(f.name+" is over 8MB, skip or compress",true); continue; }
      const id=uid();
      await idbPut({id, blob:f, name:f.name, type:f.type});
      const doc={id, name:f.name, type:f.type, size:f.size, added:new Date().toISOString().slice(0,10)};
      S.docs.push(doc); added.push(doc);
    }
    save(); render();
    // Auto-read: if AI is set up and auto-read is on, extract amount+category+person for each new doc.
    const autoOn = S.ai && S.ai.autoRead!==false;
    const readable=added.filter(d=>/pdf$/i.test(d.name)||d.type==="application/pdf"||/^image\//.test(d.type));
    if(!autoOn){ toast("Stored "+added.length+" file(s). Click AI read to extract."); return; }
    if(!aiReady()){ toast("Stored "+added.length+" file(s). Add a Gemini key in Data & AI to auto-read them."); return; }
    if(!readable.length){ toast("Stored "+added.length+" file(s)."); return; }
    let ok=0, fail=0, quotaHit=false;
    for(let i=0;i<readable.length;i++){
      const st=$("#fvst2"); if(st) st.innerHTML='<span class="spin"></span> reading '+(i+1)+' of '+readable.length+'...';
      try{ if(await extractOne(readable[i])) ok++; else fail++; }
      catch(e){ fail++; if(/free-tier limit|429/i.test(e.message)){ quotaHit=true; toast(e.message,true); break; } }
      save();
      if(i<readable.length-1) await new Promise(r=>setTimeout(r,1500)); // pace to respect per-minute free limit
    }
    render();
    if(quotaHit){ toast("Stopped at the free-tier limit after reading "+ok+". Wait a minute and re-read the rest, or claim them manually."); return; }
    if(readable.length===1 && ok===1){
      // single upload: jump straight into the pre-filled Claim Wizard
      toast("Read: "+(readable[0].summary||"").slice(0,50)); claimWizard(readable[0].id);
    } else {
      toast("Auto-read "+ok+" of "+readable.length+" invoices"+(fail?", "+fail+" need manual read":"")+". Each shows its amount and suggested category, click Claim to file.");
    }
  }
  m.querySelectorAll(".nba").forEach(b=>b.onclick=()=>go(b.dataset.t));
  m.querySelectorAll(".vdel").forEach(b=>b.onclick=async()=>{ const id=b.dataset.id, dm=S.docs.find(d=>d.id===id);
    if(dm&&dm.carriedFor) return toast("This invoice is here because FY"+(S.meta.activeFY||FY.label)+" claims part of that asset. To remove it, edit or remove the asset in the Asset Register.",true);
    S.docs=S.docs.filter(d=>d.id!==id);
    if(!docUsedElsewhere(id)) await idbDel(id); else toast("Removed from this year. The file is kept because another year or the Asset Register uses it.");
    b.dataset.id=id; ["deepu","bhavana"].forEach(pk=>S.people[pk].deductions.forEach(d=>d.evidence=(d.evidence||[]).filter(x=>x!==b.dataset.id))); save(); render(); });
  m.querySelectorAll(".vview").forEach(b=>b.onclick=async()=>{ const rec=await idbGet(b.dataset.id); if(!rec) return toast("Missing blob",true); const url=URL.createObjectURL(rec.blob); window.open(url,"_blank"); });
  m.querySelectorAll(".vread").forEach(b=>b.onclick=async()=>{
    const doc=S.docs.find(d=>d.id===b.dataset.id); const rec=await idbGet(doc.id);
    if(!rec) return toast("Missing blob",true);
    const isPdf=/pdf$/i.test(doc.name)||doc.type==="application/pdf";
    const isImg=/^image\//.test(doc.type);
    if(!isPdf&&!isImg) return toast("AI read supports PDF and images. CSV/XLSX: paste key figures manually.",true);
    if(!aiReady()){ toast("Add your Gemini API key in Data & AI to auto-read documents (one-time setup).",true); go("data"); return; }
    b.innerHTML='<span class="spin"></span>';
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(rec.blob);});
      const content=[ isPdf? {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}} : {type:"image",source:{type:"base64",media_type:doc.type,data:b64}},
        {type:"text",text:EXTRACT_PROMPT}];
      const txt=await askAI(content, SYS_TAX);
      const j=parseJSONLoose(txt);
      doc.extract=j; doc.summary=(j.vendor||"")+" "+(j.date||"")+" "+money(j.total||0)+" -> "+(j.suggestedCategory||"")+". "+(j.claimableNote||"");
      save(); render(); toast("Extracted: "+doc.summary.slice(0,60));
      claimWizard(doc.id);
    }catch(e){
      toast(aiName()+" read failed ("+e.message+"). Check your API key in Data & AI, or paste figures manually.",true); render();
    }
  });
  m.querySelectorAll(".vclaim").forEach(b=>b.onclick=()=>claimWizard(b.dataset.id));
  m.querySelectorAll(".vunclaim").forEach(b=>b.onclick=()=>{
    clearDocClaims(b.dataset.id);
    const d=S.docs.find(x=>x.id===b.dataset.id); if(d) delete d.claimed;
    save(); render(); toast("Claim removed. The document is still in the vault.");
  });
};

/* ---- PRIOR-YEAR RETURNS ---- */
VIEWS.prior=(m)=>{
  const uploads=S.docs.filter(d=>/pdf$/i.test(d.name)||/^image\//.test(d.type));
  const card=(pk)=>{
    const P=S.people[pk]; const pr=S.priorReturns[pk];
    let inner='<h3>'+P.name+'\u2019s prior return <span class="tag">before FY'+FY.label+'</span></h3>';
    if(!pr){
      inner+='<div class="hint" style="margin-bottom:8px">Upload '+P.name+'\u2019s last tax return or Notice of Assessment to the Evidence Vault first, then analyse it here. '+aiName()+' finds deductions that repeat every year and assets still being depreciated, and adds them to this year where they still apply.</div>'+
      '<div class="row"><select id="pr_'+pk+'" style="min-width:200px"><option value="">Choose an uploaded PDF/image...</option>'+uploads.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join("")+'</select>'+
      '<button class="btn sm pran" data-pk="'+pk+'">Analyse with '+aiName()+'</button></div>';
      if(!uploads.length) inner+='<div class="hint" style="margin-top:6px">No PDFs or images in the vault yet. Go to Evidence Vault and upload the return first.</div>';
    } else {
      inner+='<div class="kv"><span>Reported taxable income ('+esc(pr.fy||"prior FY")+')</span><b>'+money(pr.taxableIncome||0)+'</b></div>'+
      '<div class="kv"><span>Total deductions that year</span><b>'+money(pr.totalDeductions||0)+'</b></div>';
      const rec=(pr.deductionsFound||[]).filter(d=>d.recurring);
      const assets=(pr.assets||[]);
      // ASSET CARRY-FORWARD (the real depreciation continuation)
      if(assets.length){
        inner+='<div style="margin-top:12px"><b>Depreciating assets: decline in value continued to FY'+FY.label+'</b>'+
        '<div class="hint" style="margin-bottom:4px">Prime cost (straight line). The tool works from original cost, date and effective life, NOT from what was claimed last year. Fully written-off items show $0.</div>'+
        '<table style="margin-top:4px"><tr><th>Asset</th><th class="num">Cost</th><th>Bought</th><th class="num">This FY claim</th><th></th></tr>'+
        assets.map((a,i)=>{ const c=a.carry||primeCostCarry(a);
          const cell = c.done?'<span class="hint">'+esc(c.reason.split(".")[0])+'</span>' : (c.needInput?'<span class="pill gold" style="font-size:10px">need cost/life/date</span>':'<b class="money pos">'+money(c.claimable)+'</b>');
          const btn = (!c.done&&!c.needInput&&c.claimable>0)?'<button class="btn sm prasset" data-pk="'+pk+'" data-i="'+i+'">Add to register</button>':(c.needInput?'<button class="btn sm ghost prassetfix" data-pk="'+pk+'" data-i="'+i+'">Fix inputs</button>':'<span class="hint">nothing to add</span>');
          return '<tr><td>'+esc(a.label||"asset")+' <span class="hint">'+num(a.workUsePct)+'% work, '+ (num(a.effectiveLifeYears)||"?")+'yr life</span></td><td class="num">'+money(a.cost||0)+'</td><td>'+esc(a.purchaseDate||"?")+'</td><td class="num">'+cell+'</td><td>'+btn+'</td></tr>'+
          '<tr><td colspan="5" class="hint" style="padding-top:0;opacity:.85">'+esc((a.carry||c).reason)+'</td></tr>';
        }).join("")+'</table></div>';
      }
      // RECURRING (do NOT copy amounts; point to FinVault for real current-year figures)
      if(rec.length){ inner+='<div style="margin-top:12px"><b>Recurring deductions to check for this year</b>'+
        '<div class="hint" style="margin-bottom:4px">These repeat yearly, but claim THIS year\u2019s actual spend, not last year\u2019s. Best path: upload FinVault and let the scan find the real amounts. Adding here pre-fills last year\u2019s figure as a placeholder only.</div>'+
        '<table style="margin-top:4px"><tr><th>Label</th><th class="num">Last year</th><th></th></tr>'+
        rec.map((d,i)=>'<tr><td>'+esc(d.label)+' <span class="hint">'+esc(d.atoLabel||"")+(num(d.workUsePct)?", "+num(d.workUsePct)+"%":"")+'</span></td><td class="num">'+money(d.amount||0)+'</td><td><button class="btn sm dim praddr" data-pk="'+pk+'" data-i="'+i+'">Pre-fill placeholder</button></td></tr>').join("")+'</table></div>'; }
      if(num(pr.capitalLossCarried)>0) inner+='<div class="note" style="margin-top:10px;border-color:var(--gold)">Capital loss carried forward from '+esc(pr.fy||"last year")+': '+money(pr.capitalLossCarried)+'. This only offsets future capital gains, never salary. It is tracked on the Property &amp; CGT tab.</div>';
      if((pr.suggestions||[]).length){ inner+='<div style="margin-top:12px"><b>Things to check</b><ul style="margin:6px 0 0 18px">'+pr.suggestions.map(s=>'<li class="hint" style="margin-bottom:3px">'+esc(s)+'</li>').join("")+'</ul></div>'; }
      inner+='<div class="row" style="margin-top:12px"><button class="btn sm ghost prredo" data-pk="'+pk+'">Re-analyse a different file</button></div>';
    }
    return '<div class="card">'+inner+'</div>';
  };
  m.innerHTML=head("Prior-year returns","Upload last year\u2019s returns and let AI carry the still-relevant claims into this year. The key distinction: depreciating assets over $300 (desk, laptop) keep declining in value and the tool computes this year\u2019s slice from cost, date and effective life. Recurring bills (internet, phone, subscriptions) do NOT carry a leftover value, you claim this year\u2019s actual spend, which the FinVault scan can extract for you.")+
  '<div class="grid g2">'+card("deepu")+card("bhavana")+'</div>';
  m.querySelectorAll(".pran").forEach(b=>b.onclick=async()=>{
    const pk=b.dataset.pk; const sel=$("#pr_"+pk); const id=sel&&sel.value;
    if(!id) return toast("Choose an uploaded file first",true);
    if(!aiReady()) return toast("Add your Gemini API key in Data & AI first",true);
    b.innerHTML='<span class="spin"></span> analysing';
    try{ await analysePriorReturn(id, pk); render(); toast("Analysed "+S.people[pk].name+"\u2019s prior return"); }
    catch(e){ toast("Analysis failed: "+e.message,true); render(); }
  });
  m.querySelectorAll(".prredo").forEach(b=>b.onclick=()=>{ S.priorReturns[b.dataset.pk]=null; save(); render(); });
  m.querySelectorAll(".praddr").forEach(b=>b.onclick=()=>{
    const pk=b.dataset.pk, i=Number(b.dataset.i);
    const rec=(S.priorReturns[pk].deductionsFound||[]).filter(d=>d.recurring)[i];
    if(!rec) return;
    S.people[pk].deductions.push({id:uid(), src:null, cat:mapLabelToCat(rec.atoLabel), label:rec.label+" (recurring, PLACEHOLDER from "+esc(S.priorReturns[pk].fy||"last FY")+")", amount:num(rec.amount), evidence:[], notes:"PLACEHOLDER using last year\u2019s figure. Replace with this year\u2019s actual spend and attach this year\u2019s receipt."});
    save(); toast("Placeholder added. Replace with this year\u2019s actual amount."); render();
  });
  m.querySelectorAll(".prasset").forEach(b=>b.onclick=()=>{
    const pk=b.dataset.pk, i=Number(b.dataset.i); const a=S.priorReturns[pk].assets[i]; const c=a.carry||primeCostCarry(a);
    if(!c||c.claimable<=0) return;
    // Into the cross-year register: the prior return shows it was claimed then, so mark that year claimed
    const priorFy=S.priorReturns[pk].fy||prevFYLabel(S.meta.activeFY||FY.label);
    const asset={id:uid(), label:a.label||"Asset", owner:pk, cost:num(a.cost), purchaseDate:String(a.purchaseDate).slice(0,10), life:num(a.effectiveLifeYears),
      workPct:num(a.workUsePct)||100, method:"pc", claimedYears:{[priorFy]:"claimed"}, docId:S.priorReturns[pk].docId||null, cat:"D5"};
    if((S.assets||[]).some(x=>x.label===asset.label&&x.purchaseDate===asset.purchaseDate&&x.owner===pk)) return toast("Already in the Asset Register",true);
    S.assets=S.assets||[]; S.assets.push(asset); syncAssetLines(); save();
    toast("Added to the Asset Register (prime cost, as most returns use). If last year used diminishing value, change the method there."); go("assets");
  });
  m.querySelectorAll(".prassetfix").forEach(b=>b.onclick=()=>{
    const pk=b.dataset.pk, i=Number(b.dataset.i); const a=S.priorReturns[pk].assets[i];
    const dlg=$("#modal");
    dlg.innerHTML='<h3 class="serif">Asset details: '+esc(a.label||"asset")+'</h3><div class="hint" style="margin-bottom:8px">The return did not state everything. Fill these so the tool can compute this year\u2019s prime-cost decline.</div>'+
    '<div class="grid g2"><div><label class="lbl">Original cost $</label><input id="ax_cost" type="number" step="any" value="'+(a.cost||"")+'"></div>'+
    '<div><label class="lbl">Effective life (years)</label><input id="ax_life" type="number" step="any" value="'+(a.effectiveLifeYears||"")+'"></div>'+
    '<div><label class="lbl">Purchase date</label><input id="ax_date" type="date" value="'+esc(a.purchaseDate||"")+'"></div>'+
    '<div><label class="lbl">Work-use %</label><input id="ax_pct" type="number" step="any" value="'+(a.workUsePct||100)+'"></div></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="ax_ok">Recompute</button><button class="btn dim" id="ax_x">Cancel</button></div>';
    dlg.showModal();
    dlg.querySelector("#ax_x").onclick=()=>dlg.close();
    dlg.querySelector("#ax_ok").onclick=()=>{
      a.cost=num(dlg.querySelector("#ax_cost").value); a.effectiveLifeYears=num(dlg.querySelector("#ax_life").value);
      a.purchaseDate=dlg.querySelector("#ax_date").value; a.workUsePct=num(dlg.querySelector("#ax_pct").value)||100;
      a.carry=primeCostCarry(a); save(); dlg.close(); render();
      toast(a.carry.claimable>0?("This year: "+money(a.carry.claimable)):a.carry.reason);
    };
  });
};
function mapLabelToCat(l){ l=String(l||"").toUpperCase(); const m=l.match(/D\d+/); if(m) return m[0]; if(/BUSINESS|ABN/.test(l)) return "D5"; if(/RENT/.test(l)) return "D5"; return "D5"; }

/* ---- RECURRING BILL DETECTOR (annualises monthly spend from FinVault) ----
   Groups by a normalised merchant key, detects a roughly-monthly cadence,
   and annualises so this year's real spend drives the claim (not last year's return). */
const BILL_KINDS=[
  {key:"internet", rx:/\b(nbn|internet|broadband|tpg|aussie ?broadband|superloop|launtel|telstra ?internet|optus ?internet|exetel|dodo|iinet|belong)\b/i, shared:true, label:"Home internet"},
  {key:"mobile",   rx:/\b(mobile|telstra|optus|vodafone|amaysim|boost|felix|kogan mobile|aldi mobile|circles)\b/i, shared:false, label:"Mobile plan"},
  {key:"energy",   rx:/\b(energy|electric|origin|agl|energyaustralia|red energy|alinta|powershop|ovo|momentum)\b/i, shared:true, label:"Electricity"},
  {key:"gas",      rx:/\b(gas)\b/i, shared:true, label:"Gas"},
  {key:"software", rx:/\b(microsoft|office ?365|adobe|google ?one|dropbox|canva|creately|notion|github|jetbrains|atlassian|zoom)\b/i, shared:false, label:"Software subscription"}
];
function merchantKey(desc){
  return String(desc||"").toLowerCase().replace(/\d+/g,"").replace(/[^a-z ]+/g," ").replace(/\b(pty|ltd|australia|au|payment|direct debit|dd|autopay|recurring|pos|visa|mastercard)\b/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
}
/* ===== FinVault date + dedup intelligence ===== */
function txnDate(x){ return String(x.date||x.Date||x.transactionDate||"").slice(0,10); }

/* ===== Missing Income Detector =====
   Scans FinVault CREDITS (money in) for patterns that look like income, then compares
   against what has been declared, so nothing the ATO has pre-filled gets forgotten.
   Flags possibilities to check, never asserts the money IS income. */
function detectMissingIncome(){
  const txns=(S.finvault.txns||[]).filter(inFY);
  const credits=txns.filter(x=>num(x.amount!==undefined?x.amount:x.Amount)>0);
  const sumFor=re=>credits.filter(x=>re.test(String(x.desc||x.description||x.Description||"").toLowerCase())).reduce((a,x)=>a+num(x.amount!==undefined?x.amount:x.Amount),0);
  const out=[];
  // rideshare / gig income
  const gig=sumFor(/uber|didi|ola|lyft|doordash|menulog|deliveroo|amazon flex|airtasker/);
  const declaredBiz=num(S.business.uber.income)+num(S.business.meridian.income);
  if(gig>200 && declaredBiz < gig*0.5)
    out.push({k:"gig", label:"Possible rideshare / gig income", found:gig,
      note:"Deposits totalling about "+money(gig)+" look like rideshare or gig platforms, but declared business income is "+money(declaredBiz)+". If this is business income it must be declared. The ATO data-matches these platforms."});
  // interest
  const declaredInt=activePeople().reduce((a,pk)=>a+num(S.people[pk].other.interest),0);
  const foundInt=sumFor(/interest|int pd|credit interest|bonus interest/);
  if(foundInt>10 && declaredInt < foundInt*0.7)
    out.push({k:"int", label:"Possible bank interest", found:foundInt,
      note:"About "+money(foundInt)+" looks like interest, but "+money(declaredInt)+" is declared. Banks pre-report interest to the ATO, so a mismatch triggers an automatic adjustment. Add it under Income."});
  // dividends
  const declaredDiv=activePeople().reduce((a,pk)=>a+num(S.people[pk].other.dividendsUnf)+num(S.people[pk].other.dividendsFr),0);
  const foundDiv=sumFor(/dividend|div pmt|franking|share registry|computershare|link market/);
  if(foundDiv>50 && declaredDiv < foundDiv*0.7)
    out.push({k:"div", label:"Possible dividends", found:foundDiv,
      note:"About "+money(foundDiv)+" looks like dividend income, but "+money(declaredDiv)+" is declared. Dividends are pre-reported. Check your holdings and add any missing amount."});
  // rent
  const foundRent=sumFor(/rent|rental|property manager|real estate|ray white|lj hooker|first national/);
  const declaredRent=modOn("rental")?num(S.property.rental.rent):0;
  if(foundRent>500 && declaredRent < foundRent*0.6)
    out.push({k:"rent", label:"Possible rental income", found:foundRent,
      note:"About "+money(foundRent)+" looks like rent received, but "+money(declaredRent)+" is declared as rental income"+(modOn("rental")?"":" and the rental section is turned off")+". If you receive rent it must be declared."});
  // crypto (can't quantify gain, just a prompt)
  const cryptoHits=credits.filter(x=>/binance|coinbase|coinspot|kraken|crypto|swyftx|independent reserve|btc markets/.test(String(x.desc||x.description||"").toLowerCase()));
  const cryptoAny=txns.filter(x=>/binance|coinbase|coinspot|kraken|crypto|swyftx|independent reserve|btc markets/.test(String(x.desc||x.description||"").toLowerCase()));
  if(cryptoAny.length)
    out.push({k:"crypto", label:"Crypto exchange activity seen", found:0,
      note:cryptoAny.length+" transaction(s) mention a crypto exchange. Selling or swapping crypto is a CGT event, even crypto-to-crypto. If you disposed of any during the year, the gain or loss must be reported. This tool does not compute crypto CGT, see a registered agent if it is significant."});
  return out;
}

function inFY(x){
  const d=txnDate(x); if(!d) return false;           // no date -> treat as out of range (safer)
  return d>=FY.start && d<=FY.end;
}
// split a transaction list into this-FY and out-of-range, with a per-year tally of what was dropped
function splitByFY(txns){
  const inRange=[], out=[], byYear={};
  txns.forEach(x=>{
    if(inFY(x)) inRange.push(x);
    else { out.push(x); const y=(txnDate(x)||"unknown").slice(0,4); byYear[y]=(byYear[y]||0)+1; }
  });
  return { inRange, out, byYear };
}
// Has this transaction already been turned into a claim anywhere (deduction, business expense,
// rental, shared bill, or an accepted FinVault flag)? Match on amount + a normalised description.
function alreadyClaimed(x){
  const amt=Math.round(Math.abs(num(x.amount!==undefined?x.amount:x.Amount))*100)/100;
  const key=merchantKey(String(x.desc||x.description||x.Description||""));
  const near=(a)=>Math.abs(Math.abs(num(a))-amt)<=Math.max(0.5, amt*0.02); // within 2% or 50c
  const keyTokens=key.split(" ").filter(t=>t.length>=3);
  const textHit=(label)=>{
    const k2=merchantKey(String(label||"")); if(!k2||!key) return false;
    if(k2.includes(key)||key.includes(k2)) return true;          // full-substring match
    const t2=k2.split(" ").filter(t=>t.length>=3);
    if(!keyTokens.length||!t2.length) return false;
    // shared distinctive tokens: the first significant token matches, or 2+ tokens overlap
    const shared=keyTokens.filter(t=>t2.includes(t));
    if(shared.length>=2) return true;
    if(shared.length>=1 && (keyTokens[0]===t2[0])) return true;   // same leading merchant word
    return false;
  };
  // person deductions
  for(const pk of ["deepu","bhavana"]) for(const d of (S.people[pk].deductions||[]))
    if(near(d.amount)&&textHit(d.label)) return {where:pname(pk)+" deduction", label:d.label};
  // business expenses
  for(const bk of ["uber","meridian"]) for(const e of (S.business[bk].expenses||[]))
    if(near(e.amount)&&textHit(e.label)) return {where:bizName(bk)+" expense", label:e.label};
  // the Asset Register: same cost, bought within a week of the bank charge
  const xd=new Date(String(x.date||"").slice(0,10));
  for(const a of (S.assets||[]))
    if(near(a.cost)&&(!x.date||isNaN(xd)||Math.abs((new Date(a.purchaseDate)-xd)/86400000)<=7)) return {where:"Asset Register", label:a.label};
  // accepted finvault flags
  for(const f of (S.finvault.flags||[]))
    if(f.status&&f.status!=="new"&&near(f.amount)&&textHit(f.desc)) return {where:"already accepted", label:f.desc};
  // shared bills (by label match only; amounts there are annualised so amount match is unreliable)
  const strongText=(label)=>{ const k2=merchantKey(String(label||"")); if(!k2||!key)return false;
    if(k2.includes(key)||key.includes(k2))return true;
    const t2=k2.split(" ").filter(t=>t.length>=3);
    return keyTokens.filter(t=>t2.includes(t)).length>=2; };
  for(const b of (S.sharedBills||[])) if(strongText(b.label)) return {where:"shared bill", label:b.label};
  return null;
}

function detectRecurring(txns){  const groups={};
  txns.forEach(t=>{
    const amt=Math.abs(num(t.amount)); if(!amt) return;
    const desc=String(t.desc||t.description||"");
    const kind=BILL_KINDS.find(k=>k.rx.test(desc));
    const key=(kind?kind.key+":":"")+merchantKey(desc);
    (groups[key]=groups[key]||{key, kind, desc, txns:[]}).txns.push({date:t.date, amt});
  });
  const out=[];
  Object.values(groups).forEach(g=>{
    if(g.txns.length<2) return; // need a pattern
    const amts=g.txns.map(x=>x.amt).sort((a,b)=>a-b);
    const median=amts[Math.floor(amts.length/2)];
    // consistency: recurring bills are near-constant; groceries vary a lot. Coeff of variation gate.
    const mean=amts.reduce((a,b)=>a+b,0)/amts.length;
    const sd=Math.sqrt(amts.reduce((a,b)=>a+(b-mean)*(b-mean),0)/amts.length);
    const cv=mean?sd/mean:1;
    const isBillKind=!!g.kind;
    // keep if it matches a known bill/subscription merchant, OR it is a small, very consistent charge (a subscription we did not name)
    if(!isBillKind && !(cv<0.02 && median<=100 && g.txns.length>=3)) return;
    // cadence: median gap between dated txns
    const dates=g.txns.map(x=>Date.parse(x.date)).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
    let gaps=[]; for(let i=1;i<dates.length;i++) gaps.push((dates[i]-dates[i-1])/86400000);
    const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:30;
    let cadence="monthly", perYear=12;
    if(avgGap>=80){ cadence="quarterly"; perYear=4; }
    else if(avgGap>=45&&avgGap<80){ cadence="bi-monthly"; perYear=6; }
    else if(avgGap>=20&&avgGap<45){ cadence="monthly"; perYear=12; }
    else if(avgGap>=6&&avgGap<20){ cadence="fortnightly"; perYear=26; }
    else if(avgGap<6){ cadence="weekly"; perYear=52; }
    const seenTotal=g.txns.reduce((a,b)=>a+b.amt,0);
    const annual=Math.round(Math.max(seenTotal, median*perYear));
    out.push({ key:g.key, kind:g.kind, label:(g.kind?g.kind.label:titleCase(g.desc)), sample:g.desc.slice(0,40), count:g.txns.length, median:Math.round(median*100)/100, cadence, annual, shared:!!(g.kind&&g.kind.shared) });
  });
  return out.sort((a,b)=>b.annual-a.annual);
}
function titleCase(s){ return String(s||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).slice(0,30); }

function storageBytes(){ let n=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); n+=(k.length+(localStorage.getItem(k)||"").length); } }catch(e){} return n*2; }
function storageLine(){
  const b=storageBytes(); const mb=b/1024/1024; const cap=5; const pct=Math.min(100,Math.round(mb/cap*100));
  const col = pct>85?"var(--red)":pct>60?"var(--gold)":"var(--green)";
  const txcount=(S.finvault&&S.finvault.txns)?S.finvault.txns.length:0;
  return 'Browser storage in use: <b style="color:'+col+'">'+mb.toFixed(2)+' MB of ~'+cap+' MB ('+pct+'%)</b>'+(txcount>500?'. The '+txcount+' loaded transactions are likely most of it, clearing them frees space and does not affect your deductions.':'. Documents are stored separately and do not count toward this.');
}
function clearLoadedTxns(){
  if(!confirm("Clear the loaded FinVault transactions? This frees storage. Your deductions, documents, income and flags are NOT affected. You can re-paste transactions any time to re-scan.")) return;
  S.finvault.txns=[]; save(); render(); toast("Transactions cleared. Storage freed.");
}

// Infer which tab a flag relates to, from its id
function flagTab(id){
  if(/^mls|^d293_|^help_|^cap_|^res_/.test(id)) return "income";
  if(/^gst|^ncl_|^psi|^cpk/.test(id)) return "biz";
  if(/^cg|^smsf|^rent/.test(id)) return "prop";
  if(/^dd_|^noi_|^reimb_|^selfed_|^dgr_|^wre_|^round_|^dc_|^frank_/.test(id)) return "interview";
  if(/^fvinbox|^fvdash/.test(id)) return "fin";
  if(/^dashe_|^dashw_|^dashpi/.test(id)) return "biz";
  if(/^rcpt_/.test(id)) return "ded";
  if(/^amiss_|^aunk_|^anodoc_/.test(id)) return "assets";
  if(/^sb\d|^sb100_/.test(id)) return "interview";
  if(/^prefill|^payg|^scope/.test(id)) return "lodge";
  return "audit";
}

  '<label><input type="radio" name="aim" value="claude" '+(S.ai.mode==="claude"?"checked":"")+' style="width:auto"> Claude (only works inside the Claude artifact environment)</label>'+
  '<label><input type="radio" name="aim" value="paste" '+(S.ai.mode==="paste"?"checked":"")+' style="width:auto"> Copy-paste loop (no key, most private, more manual)</label>'+
  '<div id="gemBox" style="margin-top:10px;'+(S.ai.mode==="gemini"?"":"display:none")+'">'+
  '<label class="lbl">Gemini API key</label><input id="gkey" type="password" value="'+esc(S.ai.geminiKey||"")+'" placeholder="AIza..." style="width:100%">'+
  '<label class="lbl" style="margin-top:6px">Model</label><select id="gmodel">'+
  [["gemini-2.5-flash-lite","gemini-2.5-flash-lite (cheapest, best free-tier throughput, good for reading receipts)"],
   ["gemini-2.5-flash","gemini-2.5-flash (more capable, lower free-tier limit)"],
   ["gemini-3.1-flash-lite","gemini-3.1-flash-lite (newest cost-efficient)"],
   ["gemini-3.5-flash","gemini-3.5-flash (most capable Flash, free-tier eligible)"],
   ["gemini-2.5-pro","gemini-2.5-pro (best reasoning, tighter free limit)"]]
   .map(([v,l])=>'<option value="'+v+'"'+(S.ai.geminiModel===v?" selected":"")+'>'+l+'</option>').join("")+'</select>'+
   '<div class="hint" style="margin-top:2px">These are current models (the older 2.0 models were shut down by Google in June 2026). For reading a stack of invoices, flash-lite has the most generous free throughput. Note: your consumer Gemini Advanced subscription does NOT give API quota, the API free tier is separate and rate-limited per minute.</div>'+
  '<div class="row" style="margin-top:8px"><button class="btn sm" id="gsave">Save key</button><button class="btn sm ghost" id="gtest">Test connection</button><span class="hint" id="gstat">'+(S.ai.geminiKey?"Key saved in this browser":"No key yet")+'</span></div>'+
  '<div class="hint" style="margin-top:6px">Get a free key at aistudio.google.com/apikey. The key is stored only in this browser and sent only to Google when you read a document. It is included in your backup file, so keep backups private.</div></div>'+
  '<div class="row" style="margin-top:10px"><button class="btn ghost" id="askfree">Ask '+aiName()+' anything (full context)</button></div></div>'+
  '<div class="card"><h3>Backup &amp; restore <span class="tag">includes files</span></h3>'+
  '<div class="row"><button class="btn" id="expF">Export full backup</button><button class="btn ghost" id="impF">Restore from backup</button></div>'+
  '<div class="hint" style="margin-top:6px">The full backup bundles every uploaded document plus all your entries into one .taxmax.json file. Save it to OneDrive or Google Drive. Restoring it on any machine brings back your Evidence Vault exactly. Export after every session.</div>'+
  '<div class="row" style="margin-top:12px"><button class="btn gold" id="expDrive">Organised export for Google Drive</button></div>'+
  '<div class="hint" style="margin-top:6px">Builds a ZIP for the current year (FY '+FY.label+') with folders <b>'+esc(pname("deepu"))+'</b>'+(hasSpouse()?', <b>'+esc(pname("bhavana"))+'</b>, <b>Both</b>':'')+', each proof filed once (no duplicates) under who it supports, plus a contents list and the machine-readable backup. Unzip it into your Google Drive. Since this is an offline tool, it cannot upload to Drive by itself, this one click gives you the organised folder to drop in.</div>'+
  '<div class="row" style="margin-top:12px"><button class="btn dim" id="expJ">Data-only JSON</button><button class="btn dim" id="wipe">Wipe this browser</button></div>'+
  '<div class="hint">Data-only is smaller but does NOT include the files. The full backup is the one that protects you.</div></div>'+
  '<div class="card"><h3>Cross-device sync <span class="tag">encrypted &middot; automatic</span></h3>'+
  '<div class="hint" style="margin-bottom:8px">Keeps every financial year, the asset register and your documents in step between laptop and phone through two private GitHub gists. Everything is encrypted in this browser with your passphrase first, so GitHub only ever holds ciphertext. On each device enter the same token and passphrase: the gists are found automatically.</div>'+
  '<div class="two">'+
  '<div><label class="lbl">GitHub token</label><input id="syncTok" type="password" placeholder="github_pat_... or ghp_..." value="'+esc(S.sync.token||"")+'"><div class="hint">github.com/settings/tokens: a fine-grained token with Account permission “Gists: Read and write”, or a classic token with only “gist” ticked. Stays in this browser, never in backups.</div></div>'+
  '<div><label class="lbl">Passphrase (the encryption key)</label><input id="syncPass" type="password" placeholder="a long phrase only you know" value="'+esc(S.sync.passphrase||"")+'"><div class="hint">Same phrase on every device. Lose it and the synced copy can’t be decrypted, by design.</div></div>'+
  '</div>'+
  '<label style="display:block;margin-top:8px"><input type="checkbox" id="syncAuto" '+(S.sync.auto!==false?"checked":"")+' style="width:auto"> Sync automatically (pull when the app opens, push about 20 seconds after you stop editing)</label>'+
  '<div class="row" style="margin-top:10px"><button class="btn gold" id="syncPush">Sync now</button><button class="btn ghost" id="syncPull">Pull now</button><button class="btn dim" id="syncSave">Save settings</button></div>'+
  '<div class="hint" id="syncLive" style="margin-top:6px;color:'+(S.sync.statusBad?"var(--red)":"var(--ink-dim)")+'">'+esc(S.sync.status||(syncConfigured()?"Ready":"Not set up on this device"))+'</div>'+
  '<div class="hint" style="margin-top:4px">'+(S.sync.lastPush?"Last push: "+esc(S.sync.lastPush.slice(0,16).replace("T"," ")):"Not pushed yet")+(S.sync.lastPull?" &middot; Last pull: "+esc(S.sync.lastPull.slice(0,16).replace("T"," ")):"")+'</div>'+
  '<details style="margin-top:6px"><summary>Advanced: gist IDs</summary><div class="two" style="margin-top:6px"><div><label class="lbl">State gist ID</label><input id="syncGist" value="'+esc(S.sync.gistId||"")+'" placeholder="found automatically"></div><div><label class="lbl">Documents gist ID</label><input id="syncDocsGist" value="'+esc(S.sync.docsGistId||"")+'" placeholder="found automatically"></div></div></details>'+
  '<div class="note" style="border-color:var(--gold);margin-top:8px">If both devices change the same financial year before syncing, the most recently edited copy of that year wins (asset register entries merge one by one). Documents larger than a few MB in total per bundle stay on the device that has them: the full backup file still carries everything.</div></div></div>'+
  '<div class="card" style="margin-top:12px"><h3>Linked apps <span class="tag">read-only</span></h3>'+
  '<div class="hint" style="margin-bottom:8px">TaxMax reads, never writes. Both links use the GitHub token above, and everything stays encrypted end to end.</div>'+
  '<div class="two">'+
   '<div><label><input type="checkbox" id="lnkDash" '+(linksCfg().dash!==false?"checked":"")+' style="width:auto"> <b>DASH</b> (rideshare income, logbook, car costs, receipts)</label>'+
    '<div class="hint">'+esc(LINKS.status.dash||"Not checked yet")+'</div>'+
    '<div class="hint" style="margin-top:4px">In DASH: Settings, Send to TaxMax. Use the same GitHub token and <b>this app\u2019s sync passphrase</b>.</div></div>'+
   '<div><label><input type="checkbox" id="lnkFv" '+(linksCfg().fv!==false?"checked":"")+' style="width:auto"> <b>FinVault</b> (bank transactions)</label>'+
    '<label class="lbl" style="margin-top:6px">FinVault sync passphrase</label><input id="lnkFvPass" type="password" value="'+esc(linksCfg().fvPass||"")+'" placeholder="the passphrase FinVault household sync uses">'+
    '<details style="margin-top:4px"><summary>FinVault gist ID (only if it is on another GitHub account)</summary><input id="lnkFvGist" value="'+esc(linksCfg().fvGist||"")+'" placeholder="found automatically"></details>'+
    '<div class="hint">'+esc(LINKS.status.fv||"Not checked yet")+'</div></div>'+
  '</div>'+
  '<div class="row" style="margin-top:10px"><button class="btn" id="lnkSave">Save and check links</button></div></div>'+
  '<div class="card" style="margin-top:12px"><h3>Rates for FY '+FY.label+(FY.ratesProvisional?' <span class="pill bad">provisional</span>':' <span class="pill ok">verified</span>')+'</h3>'+
  (FY.ratesProvisional?'<div class="note" style="border-color:var(--gold);margin-bottom:8px">This year\u2019s official rates are not set yet. The tool is using prior-year placeholders so you can capture invoices now; refund figures are not final until real FY '+FY.label+' rates are added.</div>':'')+'<table>'+
  [["Resident brackets",FY.brackets.map((b,i)=>Math.round(b[1]*100)+"%"+(b[0]===Infinity||b[0]==null?" above":" to $"+b[0].toLocaleString())).join("; ")],
   ["Medicare levy","2% (nil under $"+FY.medicareLowerSingle.toLocaleString()+" single, shading in at 10c/$ to $"+FY.medicareUpperSingle.toLocaleString()+"; family reduction applies)"],
   ["MLS thresholds","Single $"+FY.mls.single.toLocaleString()+"; family $"+FY.mls.familyBase.toLocaleString()+" + $1,500 per child after the first; tiers 1% / 1.25% / 1.5%; charged on taxable income + reportable fringe benefits"],
   ["HELP/study loan","marginal: 15c/$ over $"+FY.help.thresholds[0][0].toLocaleString()+", then $8,700 + 17c/$ over $"+FY.help.thresholds[1][0].toLocaleString()+", then 10% of total over $"+FY.help.thresholds[2][0].toLocaleString()],
   ["Division 293","extra 15% on concessional super where income for surcharge purposes exceeds $250,000"],
   ["Cents per km",Math.round(FY.centsPerKm*100)+"c, 5,000 km cap per car"],["WFH fixed rate",Math.round(FY.wfhFixedRate*100)+"c per hour (record of actual hours required)"],
   ["Concessional super cap","$"+FY.concessionalCap.toLocaleString()+" (unused cap carries forward 5 years if total super balance under $500k)"],
   ["Small business income tax offset","16% of tax on net small business income, capped at $1,000"],
   ["Employee immediate asset","$300"],["Small business instant write-off","$"+FY.instantWriteOffSmallBiz.toLocaleString()+" per asset"],["Low-value pool","Assets under $1,000: 18.75% in the first year, 37.5% after"],["CGT discount","50% over 12 months"]]
   .map(r=>'<tr><td style="white-space:nowrap">'+r[0]+'</td><td class="hint">'+r[1]+'</td></tr>').join("")+'</table></div>';
  m.querySelectorAll('input[name="aim"]').forEach(r=>r.onchange=()=>{S.ai.mode=r.value; save(); render(); });
  const gk=$("#gkey"), gm=$("#gmodel");
  if($("#gsave")) $("#gsave").onclick=()=>{ S.ai.geminiKey=gk.value.trim(); S.ai.geminiModel=gm.value; save(); $("#gstat").textContent="Key saved in this browser"; toast("Gemini key saved"); };
  if($("#gtest")) $("#gtest").onclick=async()=>{ S.ai.geminiKey=gk.value.trim(); S.ai.geminiModel=gm.value; save(); $("#gstat").innerHTML='<span class="spin"></span> testing'; try{ const t=await askGemini("Reply with the single word: ok"); $("#gstat").textContent=/ok/i.test(t)?"Connected. Gemini is working.":"Got a reply: "+t.slice(0,40); toast("Gemini connected"); }catch(e){ $("#gstat").textContent="Failed: "+e.message; toast("Gemini test failed",true);} };
  $("#expF").onclick=exportFullBackup;
  if($("#expDrive")) $("#expDrive").onclick=exportOrganisedForDrive;
  const saveSync=()=>{ const tok=($("#syncTok").value||"").trim(), pass=($("#syncPass").value||"").trim();
    if(tok!==S.sync.token||pass!==S.sync.passphrase) S.sync.lastSeenVersion="";
    S.sync.token=tok; S.sync.passphrase=pass; S.sync.auto=$("#syncAuto").checked;
    S.sync.gistId=($("#syncGist").value||"").trim(); S.sync.docsGistId=($("#syncDocsGist").value||"").trim(); save({meta:true}); };
  if($("#syncSave")) $("#syncSave").onclick=()=>{ saveSync(); toast("Sync settings saved in this browser"); };
  if($("#syncPush")) $("#syncPush").onclick=async()=>{ saveSync(); await gistPush(); };
  if($("#syncPull")) $("#syncPull").onclick=async()=>{ saveSync(); await gistPull(); };
  if($("#lnkSave")) $("#lnkSave").onclick=async()=>{ const L=linksCfg(); L.dash=$("#lnkDash").checked; L.fv=$("#lnkFv").checked; L.fvPass=($("#lnkFvPass").value||"").trim(); L.fvGist=($("#lnkFvGist").value||"").trim();
    save({meta:true}); if(!S.sync.token||!S.sync.passphrase){ toast("Add the GitHub token and sync passphrase above first",true); return; }
    $("#lnkSave").innerHTML='<span class="spin"></span> checking'; await refreshLinks({force:true}); render(); toast("Links checked"); };
  if($("#syncAuto")) $("#syncAuto").onchange=()=>{ saveSync(); toast(S.sync.auto?"Automatic sync on":"Automatic sync off: use Sync now"); if(S.sync.auto) syncPull({silent:true}); };
  $("#impF").onclick=()=>{ const i=document.createElement("input"); i.type="file"; i.accept=".json"; i.onchange=async()=>{ const t=await i.files[0].text(); try{ await importFullBackup(t); }catch(e){ toast("Restore failed: "+e.message,true);} }; i.click(); };
  $("#expJ").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="taxmax_data_"+new Date().toISOString().slice(0,10)+".json"; a.click(); };
  $("#wipe").onclick=()=>{ if(confirm("Delete ALL TaxMax data (every financial year) AND files in this browser? Make sure you exported a full backup first.")){ Object.keys(localStorage).filter(k=>k.startsWith(LS_KEY)).forEach(k=>localStorage.removeItem(k)); indexedDB.deleteDatabase("taxmax_db"); S=blank(); render(); } };
  $("#askfree").onclick=()=>{
    const dlg=$("#modal");
    dlg.innerHTML='<h3 class="serif">Ask '+aiName()+'</h3><textarea class="big" id="fq" placeholder="e.g. Is my Meridian PI insurance premium fully deductible in year one?"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="go">Ask</button><button class="btn dim" id="cx">Close</button></div><div id="ans" style="margin-top:10px;white-space:pre-wrap;font-size:13px;max-height:300px;overflow:auto"></div>';
    dlg.showModal(); dlg.querySelector("#cx").onclick=()=>dlg.close();
    dlg.querySelector("#go").onclick=async()=>{
      const q=dlg.querySelector("#fq").value.trim(); if(!q) return;
      const prompt=SYS_TAX+"\n\nHOUSEHOLD CONTEXT:\n"+JSON.stringify(contextSnapshot(),null,1)+"\n\nQUESTION: "+q+"\nAnswer concisely with the ATO rule names and record-keeping requirements.";
      if(!aiReady()){ dlg.close(); showPasteModal("Free question",prompt,null,true); return; }
      dlg.querySelector("#ans").innerHTML='<span class="spin"></span>';
      try{ dlg.querySelector("#ans").textContent=await askAI(prompt); }
      catch(e){ dlg.querySelector("#ans").textContent="Call failed: "+e.message; }
    };
  };
};

/* copy-paste loop modal */
function showPasteModal(title,prompt,onJSON,noReturn){
  const dlg=$("#modal");
  dlg.innerHTML='<h3 class="serif">Copy-paste loop: '+esc(title)+'</h3>'+
  '<div class="hint">1. Copy this prompt. 2. Paste into any Claude chat. 3. '+(noReturn?'Read the answer there.':'Paste Claude\'s JSON reply below.')+'</div>'+
  '<textarea class="big" readonly id="pp">'+esc(prompt)+'</textarea>'+
  '<div class="row" style="margin-top:6px"><button class="btn sm" id="cpy">Copy prompt</button></div>'+
  (noReturn?'':'<textarea class="big" id="pr" placeholder="Paste Claude\'s JSON here" style="margin-top:8px"></textarea>')+
  '<div class="row" style="margin-top:8px">'+(noReturn?'':'<button class="btn" id="use">Apply reply</button>')+'<button class="btn dim" id="cx">Close</button></div>';
  dlg.showModal();
  dlg.querySelector("#cpy").onclick=()=>{navigator.clipboard.writeText(prompt); toast("Prompt copied");};
  dlg.querySelector("#cx").onclick=()=>dlg.close();
  if(!noReturn) dlg.querySelector("#use").onclick=()=>{ try{ onJSON(dlg.querySelector("#pr").value); dlg.close(); toast("Applied"); }catch(e){ toast("Could not parse JSON: "+e.message,true);} };
}

// Migration: existing users (data present but no setupDone flag) skip onboarding.
(function migrateExisting(){
  if(!S.meta.setupDone){
    const hasData = (S.people.deepu.name&&S.people.deepu.name!=="") ||
      num(S.people.deepu.salary.gross)>0 || (S.docs&&S.docs.length) ||
      (S.people.deepu.deductions&&S.people.deepu.deductions.length) || num(S.business.uber.income)>0;
    if(hasData){
      // seed config from whatever names exist so nothing displays blank
      if(!S.cfg.nameA) S.cfg.nameA=S.people.deepu.name||"Person 1";
      if(!S.cfg.nameB) S.cfg.nameB=S.people.bhavana.name||"Spouse";
      if(S.people.bhavana.name) S.cfg.hasSpouse=true;
      S.meta.setupDone=true; save();
    }
  }
})();
syncNames();
setActiveFYRates(S.meta.activeFY||"2025-26");
if(S.ai && /^gemini-2\.0/.test(S.ai.geminiModel||"")){ S.ai.geminiModel="gemini-2.5-flash-lite"; save(); }
syncSharedBills();
syncAssetLines();
try{ const la=importLegacyAssets(); if(la.length) setTimeout(()=>toast(la.length+" item"+(la.length===1?"":"s")+" you claimed part of last year "+(la.length===1?"is":"are")+" now in the Asset Register, with this year's share added to your deductions."),800); }catch(e){ console.error(e); }
try{ const vc=vaultAssetCandidates(); if(vc.length) setTimeout(()=>toast(vc.length+" purchase"+(vc.length===1?"":"s")+" over $300 in last year\u2019s Evidence Vault "+(vc.length===1?"is":"are")+" not in the Asset Register yet. Review "+(vc.length===1?"it":"them")+" in the Asset Register."),2600); }catch(e){ console.error(e); }
render();
autoPullOnOpen();
if(S.sync&&S.sync.token){ setTimeout(()=>refreshLinks(),1200);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-LINKS.lastAt>120000) refreshLinks({quiet:true}); });
  // While TaxMax stays open, look for new DASH / FinVault data every 3 minutes
  setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-LINKS.lastAt>170000) refreshLinks({quiet:true}); },60000); }
</script>
